<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Ossë S13 DM Screen</title>
<style>
:root{--bg:#14110f;--tile:#211b18;--panel:#1a1613;--line:#3b312a;--ink:#f3ebdc;--soft:#a99c8a;--gold:#e2be6a;--wine:#8f2735;
--steady:#3f7d4b;--bleed:#c98a2b;--dead:#0c0a09;--ward:#7fc4d8;
--bel:#6fbf9a;--gab:#ee8a8a;--gus:#e2be6a;--tim:#c3a2f2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:var(--ink);background:#33291f;border:1px solid var(--line);border-radius:7px;cursor:pointer;padding:7px 13px;font-weight:700;font-size:16px}
button:active{transform:scale(.97)}
button:disabled{opacity:.38;cursor:default}
button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.pri{background:var(--wine);border-color:#c2485a}
button.go{background:#2f5d3a;border-color:#4d8f5c}
button.quiet{background:none;color:var(--soft);font-weight:600;font-size:14px}
button.on{background:var(--gold);color:#1a130c;border-color:var(--gold)}
.bar{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.bar .tabb{font:700 18px/1 Georgia,serif;padding:10px 16px}
.bar .sp{flex:1}
.bar .home{color:var(--soft);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;padding:8px 10px;border:1px solid var(--line);border-radius:4px}
.bar .home:hover{color:var(--ink)}
.bar .mv{color:var(--soft);font-size:14px}
.grid{flex:1;min-height:0;display:grid;gap:6px;padding:6px;grid-template-columns:1fr 1fr;grid-template-rows:320px repeat(5,minmax(0,1fr))}
.grid.one{grid-template-columns:1fr;grid-template-rows:1fr}
.pn{container-type:inline-size;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pn.spot{border:2px solid var(--gold)}
.ph{display:flex;align-items:center;gap:8px;padding:7px 12px 0;flex:none}
.lab{font:700 13px/1 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ph .sp{flex:1}
.pb{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 10px}
.pc{display:inline-block;font-weight:800;font-size:13px;letter-spacing:.04em;padding:1px 8px;border-radius:4px;border:2px solid var(--c);color:var(--c);text-transform:uppercase;white-space:nowrap;line-height:1.35}
.pc.lead{background:var(--c);color:#14110f}
.pc.bel{--c:var(--bel)}.pc.gab{--c:var(--gab)}.pc.gus{--c:var(--gus)}.pc.tim{--c:var(--tim)}
.flag{color:#ffb070;font-weight:700}

/* spotlight */
.sph0{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px 0;flex:none}
.sph0 .mvh{flex:1 1 250px;min-width:0}
.sph0 .nav{margin:0}
.sph0 .nav button{flex:none;padding:10px 16px}
.spg{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:10px 14px;padding:8px 12px 10px}
.spg.pr{grid-template-columns:1.2fr 1fr}
.spg.pr>.pens{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 8px;align-items:start}
.spg.pr .penrule{grid-column:1 / -1;margin:0}
.spg.pr .pen{margin:0}
.tally.tb{margin-top:8px}
.tally.th small{width:auto;margin-right:2px}
@container (max-width:720px){.tally.th{display:none}}
@container (min-width:721px){.tally.tb{display:none}}
@container (max-width:720px){.pn .spg{display:block;overflow-y:auto}.pn .spg>div{overflow:visible;min-height:auto;margin-bottom:12px}.pn .spg>.pens{display:grid;grid-template-columns:1fr}}
.spg>div{min-height:0;overflow-y:auto}
.mvn{font:700 12px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.mvt{font:700 30px/1.05 Georgia,serif;color:var(--gold);margin:3px 0 2px}
.mvk{font-size:14px;color:var(--soft);margin-bottom:7px}
.wl{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;font-size:14.5px;line-height:1.28;align-items:start}
.tick{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:15.5px;line-height:1.28;border:1px solid transparent}
.tick:hover{border-color:var(--line)}
.tick i{flex:none;width:20px;height:20px;border:2px solid var(--soft);border-radius:4px;margin-top:1px;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:900;color:#14110f}
.tick.done{color:var(--soft);text-decoration:line-through}
.tick.done i{background:var(--steady);border-color:var(--steady)}
.pen{border-left:4px solid var(--gold);padding:5px 9px;background:var(--tile);border-radius:0 6px 6px 0;font:italic 15.5px/1.3 Georgia,serif;margin-bottom:6px}
.pen small{display:block;font:15px/1.3 Georgia,serif;color:var(--soft);margin-top:4px}
.pen small i{font:700 11px/1.2 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-style:normal;margin-right:4px}
.penrule{font-size:13px;line-height:1.3;color:var(--soft);margin-bottom:6px}
.penrule .lab{margin-right:8px;display:inline-block;margin-bottom:2px}
.pen b{display:block;font:700 11px/1.2 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-style:normal;margin-bottom:2px}
.nav{display:flex;gap:6px;margin:6px 0}
.nav button{flex:1}
.tally{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tally .pc{cursor:pointer;font-size:13px;padding:4px 8px}
.tally small{color:var(--soft);font-size:11px;letter-spacing:.1em;text-transform:uppercase;width:100%}

/* roll call */
.rcw{display:flex;flex-wrap:wrap;gap:6px}
.rc{flex:1 1 140px;border-radius:7px;padding:6px 9px;cursor:pointer;user-select:none;border:2px solid transparent;min-width:0}
.rc b{display:block;font:700 17px/1.1 Georgia,serif}
.rc>span{font-size:12.5px;opacity:.9;display:block;line-height:1.25;margin-top:2px}
.rc em{font:800 11.5px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;font-style:normal;display:block;margin-top:4px}
.rc.standing{background:var(--steady)}
.rc.down{background:var(--bleed);color:#1b1206}
.rc.dead{background:var(--dead);color:#8d8273;border-color:#3a322c}
.rc.dead b{text-decoration:line-through}
.pip{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid #1b1206;vertical-align:-3px;margin-left:6px;cursor:pointer}
.pip.f{background:#1b1206}
.mini .rc{flex-basis:112px;padding:5px 8px}.mini .rc b{font-size:15px}.mini .rc>span{display:none}
@media (max-height:280px){.one .rc{flex-basis:112px;padding:5px 8px}.one .rc b{font-size:15px}.one .rc>span{display:none}}

/* combat */
.sd{display:inline-block;font:800 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;padding:5px 0;width:56px;text-align:center;border-radius:4px;color:#fff;flex:none}
.sd.enemy{background:#a8323f}.sd.ally{background:#2f7044}.sd.party{background:#2d5fa3}
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
input.inn,input.dmgf{-moz-appearance:textfield;appearance:textfield;outline:none}
input.inn::-webkit-outer-spin-button,input.inn::-webkit-inner-spin-button,input.dmgf::-webkit-outer-spin-button,input.dmgf::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.inn:focus-visible,input.dmgf:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.notes{list-style:none;font-size:14.5px;line-height:1.3;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.notes li{padding-left:9px;border-left:3px solid var(--line)}

.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

/* initiative */
.ph button{padding:5px 12px;font-size:15px}
.ini{display:flex;flex-direction:column;gap:5px}
.ir{display:grid;grid-template-columns:52px 56px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--tile);border:2px solid transparent}
.ir.cur{border-color:var(--gold);background:#3a2c14}
.ir.dn .im{opacity:.55}
.inn{width:52px;height:42px;background:#120f0d;border:1px solid var(--line);border-radius:6px;color:var(--gold);font:700 25px/1 Georgia,serif;text-align:center}
.im{min-width:0}
.im b{font:700 18px/1.1 Georgia,serif}
.im .hpt{font:700 16px/1 system-ui;margin-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.im small{display:block;color:var(--soft);font-size:12.5px;line-height:1.25;margin-top:3px}
.dm{display:flex;gap:4px;align-items:center}
.dmgf{width:58px;height:42px;background:#120f0d;border:1px solid var(--line);border-radius:6px;color:var(--ink);font:700 21px/1 system-ui;text-align:center}
.dm button{width:42px;height:42px;padding:0;font-size:26px;line-height:1;color:#fff}
.dm .mi{background:#a8323f;border-color:#d8596b}
.dm .pl{background:#2f7044;border-color:#52a26a}
.dm .out{width:24px;background:none;border:none;color:var(--soft);font-size:20px}
.bench{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.bench small{color:var(--soft);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:2px}
.bn{font-size:13.5px;padding:4px 10px 4px 5px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;font-weight:600}
.bn .sd{width:auto;padding:3px 6px;font-size:10px}
.bn em{font-style:normal;color:var(--soft);font-weight:500}
.empty{color:var(--soft);font-size:15px;padding:6px 2px}

/* health */
.hl{display:flex;flex-direction:column;gap:8px}
.hc .top{display:flex;align-items:center;gap:8px}
.hc .top b{font:700 20px/1.1 Georgia,serif;flex:1;min-width:0}
.hc .num{font:700 19px/1 system-ui;font-variant-numeric:tabular-nums}
.hc .hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:3px}
.hb{height:18px;background:#3a2d27;border-radius:6px;overflow:hidden;border:1px solid var(--line);position:relative}
.hb i{display:block;height:100%}
.hb.ok i{background:#4c9a5c}.hb.half i{background:#d49a35}.hb.low i{background:#d8485c}
.hb.zero{background:repeating-linear-gradient(45deg,#2a211c,#2a211c 6px,#120f0d 6px,#120f0d 12px)}
.hb span{position:absolute;inset:0;display:grid;place-items:center;font:800 12.5px/1 system-ui;letter-spacing:.16em;color:#ffb9b9}
.stf{min-width:96px;max-width:200px;min-height:30px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;padding:2px 8px;border:1px dashed var(--soft);border-radius:6px;background:none;color:var(--soft);font-size:13px;font-weight:600}
.stf.has{border-style:solid;border-color:var(--gold);color:var(--gold)}
.stf.open{background:#3a2c14}
.stf .ic{width:21px;height:21px}
.res{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.rs{display:inline-flex;align-items:center;gap:3px;font:800 12px/1 system-ui;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 6px 2px 4px;background:var(--tile)}
.rs .ic{width:15px;height:15px;color:var(--soft)}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:7px;padding:6px;border:1px solid var(--gold);border-radius:7px;background:#120f0d}
.pick button{display:flex;align-items:center;gap:6px;padding:5px 7px;font-size:13px;font-weight:600;text-align:left;min-width:0}
.pick .pk{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;color:var(--gold);font:700 12px/1 system-ui;letter-spacing:.1em;text-transform:uppercase}
.foot{display:flex;gap:6px;align-items:center;margin-top:8px;padding-top:5px;border-top:1px solid var(--line)}
.foot .sp{flex:1}

.sm{padding:5px 12px;font-size:14px}
.hint{color:var(--soft);font-size:14px;line-height:1.3;margin-top:6px}
.btns .sp{flex:1}
.modal{position:fixed;inset:0;background:#000c;display:flex;padding:14px;z-index:10}
.mbox{flex:1;min-height:0;min-width:0;max-width:900px;margin:0 auto;background:var(--panel);border:2px solid var(--gold);border-radius:10px;display:flex;flex-direction:column;gap:6px;padding:4px 12px 4px}
.mbox .ph{padding:6px 0 0}
.mbox textarea{flex:1;min-height:0;resize:none;background:#120f0d;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:10px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
.mbox textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.xmsg{color:var(--gold);font-size:14px;align-self:center}

/* evidence */
.ev{display:grid;grid-template-columns:26px 1fr;gap:4px 9px;padding:7px 8px;border-radius:7px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer;background:var(--tile)}
.ev i{width:22px;height:22px;border:2px solid var(--soft);border-radius:4px;display:grid;place-items:center;font-style:normal;font-weight:900;color:#14110f;font-size:15px;margin-top:2px}
.ev.done{opacity:.55}
.ev.done i{background:var(--steady);border-color:var(--steady)}
.evh{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.evh b{font:700 18px/1.1 Georgia,serif}
.evh u{text-decoration:none;font:700 12px system-ui;letter-spacing:.06em;background:#3a2d27;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--gold)}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px}
.stk{background:var(--tile);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
.stk>b{display:block;font:700 17px/1.22 Georgia,serif;margin:6px 0}
.stk ul{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14.5px;line-height:1.3}
.stk li{padding-left:9px;border-left:3px solid var(--gold)}
.fold .stk{cursor:pointer}
.fold .stk>b{margin-bottom:0}
.fold .stk>b::after{content:" ▸";color:var(--soft);font-family:system-ui}
.fold .stk.open>b::after{content:" ▾"}
.fold .stk ul{display:none;margin-top:6px}
.fold .stk.open ul{display:flex}
.fold .hint{margin-top:4px}
.evt{font-size:15px;line-height:1.32}
.mini .ev{padding:5px 8px;margin-bottom:4px}.mini .evt{display:none}.mini .evh b{font-size:16px}

/* voices */
.vgrid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.vtile{background:var(--tile);border:1px solid var(--line);border-radius:7px;padding:7px 9px;cursor:pointer}
.vtile:hover{border-color:var(--gold)}
.vn{font:700 18px/1.05 Georgia,serif;color:var(--gold)}
.vc{font-size:12px;color:var(--soft);line-height:1.25;margin-top:2px}
.vname{font:700 24px/1 Georgia,serif;color:var(--gold)}
.how{font-size:13.5px;color:var(--soft);font-style:italic;margin:2px 0 6px}
.vbeat{font:700 11.5px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:9px 0 3px}
.line{font:italic 600 19px/1.25 Georgia,serif;margin-bottom:5px}
.sph{font:400 26px/1.36 Georgia,serif}
.sph p{margin-bottom:14px}
.sph .dir{font:italic 16px/1.3 system-ui;color:var(--soft)}
.sph .cond{color:var(--gold)}

/* sealed */
.sealbtn{flex:1;margin:10px;border:2px dashed var(--line);background:#120f0d;color:var(--soft);font:700 20px Georgia,serif;border-radius:8px}
.sec{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.3}
.sec li{padding-left:9px;border-left:3px solid var(--wine)}
table.ck{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.28}
table.ck th{text-align:left;font:700 11.5px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:3px 8px 3px 0;border-bottom:1px solid var(--line)}
table.ck td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.ck td:first-child{font-weight:700;white-space:nowrap}

/* stat blocks */
.schips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.schips button{padding:5px 11px;font-size:14px;border-radius:99px}
.sbk{background:#fdf1dc;color:#1b1410;border-radius:4px;border-top:4px solid #e69a28;border-bottom:4px solid #e69a28;padding:10px 12px;font:15.5px/1.38 "Segoe UI",system-ui,sans-serif;box-shadow:0 0 6px #0008}
.sbk p{margin:3px 0}
.sbk p b{color:#1b1410}
.sbname{font:700 28px/1.05 Georgia,"Times New Roman",serif;color:#7a200d;font-variant:small-caps;letter-spacing:.02em}
.sbsub{font-style:italic;font-size:.92em;margin-bottom:2px}
.taper{height:5px;margin:6px 0;background:#922610;clip-path:polygon(0 0,0 100%,100% 50%)}
.sbk p>b:first-child{color:#7a200d}
.abil{width:100%;border-collapse:collapse;text-align:center;color:#7a200d}
.abil th{font-size:.82em;letter-spacing:.04em;padding:0}.abil td{padding:0;font-size:.95em}
.sbk h3{font:400 21px/1.1 Georgia,serif;font-variant:small-caps;color:#7a200d;border-bottom:1px solid #7a200d;margin:10px 0 4px;letter-spacing:.03em}
.tonight{background:#f6dfae;border-left:4px solid #922610;border-radius:0 4px 4px 0;padding:5px 9px;margin:6px 0}
.tonight h4{font:700 .78em system-ui;letter-spacing:.14em;text-transform:uppercase;color:#922610;margin-bottom:1px}
.tonight p b i{font-style:normal}
.skl{columns:2;column-gap:14px}
.skl div{display:flex;justify-content:space-between;break-inside:avoid;border-bottom:1px dotted #c9b48a;padding:1px 0}
.skl div b{color:#1b1410;font-weight:600}
.skl div.pr span,.skl div.pr b{font-weight:700;color:#7a200d}
.key{font-size:.8em;color:#7a200d99;margin-top:3px}
.src{display:block;font:italic .8em/1.3 system-ui,sans-serif;color:#8a5230}
.tb{width:100%;border-collapse:collapse;font-size:.93em}
.tb th{text-align:left;font-size:.78em;letter-spacing:.06em;text-transform:uppercase;color:#7a200d;border-bottom:1px solid #c9b48a;padding:1px 4px 1px 0}
.tb td{padding:2px 4px 2px 0;border-bottom:1px dotted #d9c69c;vertical-align:top}
.tb td b{color:#1b1410}
/* touch layout: iPad in landscape, one pane, tap only */
.touch,.touch *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.touch .pb,.touch .spg{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.touch button{min-height:44px}
.touch input,.touch textarea{-webkit-user-select:text;user-select:text}
.touch .bar{padding:5px 8px}
.touch .bar .tabb{padding:8px 16px}
.tgrid{flex:1;min-height:0;display:grid;gap:6px;padding:6px;grid-template-columns:minmax(0,39fr) minmax(0,61fr);grid-template-rows:minmax(0,1fr)}
.tright{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:6px;flex:none}
.seg button{flex:1;min-height:48px;padding:6px 4px;font-size:16px}
.tview{flex:1;min-height:0;display:grid;gap:6px;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.touch .tick{padding:10px 6px}
.touch .tick i{width:24px;height:24px}
.touch .tally .pc{padding:10px 12px;font-size:14px}
.touch .rc{padding:10px}
.touch .pip{width:32px;height:32px;vertical-align:-10px}
.touch .ev{padding:10px}
.touch .vtile{padding:12px 10px}
.touch .schips button{padding:8px 14px;font-size:15px}
.tview.stack{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,.9fr) minmax(0,1.1fr)}
button.inn,button.dmgf{padding:0;cursor:pointer}
.touch .inn,.touch .dmgf{height:44px}
.touch .dmgf{width:52px;color:var(--soft)}
.inn.sel,.dmgf.sel{outline:2px solid var(--gold);outline-offset:1px}
.touch .dm .out{width:40px;font-size:24px}
.touch .stf{min-height:44px}
.touch .ph button{min-width:44px}
.touch .bn{min-height:40px;padding:6px 12px 6px 7px}
.pad{margin:0 0 8px;padding:8px;border:2px solid var(--gold);border-radius:8px;background:#120f0d}
.pad .pt{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.pad .pt b{font:700 28px/1 Georgia,serif;color:var(--gold);min-width:2em}
.pad .pt span{color:var(--soft);font-size:14px}
.pad .pk{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pad .pk button{min-height:46px;font-size:20px;padding:0}
.pad .pk .quiet{font-size:13px}
.pad .pa{display:flex;gap:6px;margin-top:6px}
.pad .pa button{flex:1;color:#fff}
.pad .mi{background:#a8323f;border-color:#d8596b}
.pad .pl{background:#2f7044;border-color:#52a26a}
.bn.add{padding:4px 12px;border-style:dashed}
.bx{padding:2px 6px;min-height:0}
.addf{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.addf input{height:40px;background:#120f0d;border:1px solid var(--line);border-radius:6px;color:var(--ink);font:600 15px system-ui,sans-serif;padding:0 8px}
.addf input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.addf #aname{flex:1 1 140px;min-width:0}
.addf #ahp{width:70px;text-align:center}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}

<script>
"use strict";
const SB=[{"name":"The Hand","sub":"Medium humanoid, neutral evil · sworn servant of the royal family","ac":"17 (rune-threaded studded leather)","hp":"91","speed":"35 ft., climb 20 ft.","abil":[14,19,14,14,14,10],"props":[["Saving Throws","Dex +7, Int +5, Wis +5"],["Skills","Acrobatics +7, Athletics +5, Perception +5, Stealth +10"],["Damage Resistances","poison"],["Senses","passive Perception 15"],["Languages","Common, Thieves' cant"],["Challenge","6"]],"tonight":[["Attacks","Two Kissed Blades a turn, +7 to hit. Hit: 14 (1d6 + 4 piercing plus 2d6 poison). He hits Belaskro's AC 15 on an 8 or higher."],["No exit","He carries no tablet. He fights to the death and does not leave the room alive."],["The ward clock","Stopped while a PC holds the room. One ward of six still burns."],["Corvane, round 2","Three warhammer blows from the Marquis every round: 1d8 + 4 plus 1d6 from Hex each. You roll. He does not stop."],["Oathbound","A hidden mark under the skin: a sworn servant of the royal family. Found on the body with Arcana DC 14 or detect magic."]],"sections":[{"h":"","items":[["The Last Ward","While it stands he cannot come within 10 feet of the bed or target Cassian. It holds as long as a PC keeps him busy. {{Works like antilife shell, against him only.}}"],["Patient Killer","Its mark is Lord Cassian. It fights anyone who gets between them."],["Widow's Kiss","A creature dropped to 0 hit points by this poison is Kissed: unconscious and poisoned, taking 7 (2d6) poison damage at the start of each turn until cured. It does not roll death saves: that damage is one failed save each turn. Healing wakes it but does not stop the poison. Cures: lesser restoration, protection from poison, or antitoxin with a DC 15 Medicine check. Spare the dying or Medicine DC 10 holds the count for one round. {{Standard rule: damage at 0 hit points is a failed death save, and it ends being stable.}}"]]},{"h":"Actions","items":[["Multiattack","Two Kissed Blade attacks."],["Kissed Blade","Melee +7, reach 5 ft. Hit: 14 (1d6 + 4 piercing plus 2d6 poison). {{Shortsword with a poison rider, as the assassin.}}"]]},{"h":"Bonus Actions","items":[["Cunning Action","Dash, Disengage or Hide. {{Rogue feature. Assassin, 2024 Monster Manual.}}"]]},{"h":"Reactions","items":[["Uncanny Dodge","Halves the damage of one attack that hits it, if it can see the attacker. {{Rogue feature.}}"]]}]},{"name":"Marquis Corvane Aerrowyn","sub":"Medium humanoid (human), neutral evil · warlock 12, Fiend patron, Pact of the Blade","ac":"18 in the field (half plate, shield) · 15 tonight (dress breastplate, no shield)","hp":"126 (12d8 + 72), plus 12 temporary from Fiendish Vigor","speed":"30 ft.","abil":[18,13,18,16,15,17],"props":[["Saving Throws","Wis +6, Cha +7"],["Skills","Athletics +8, Deception +7, Insight +6, Intimidation +7, Perception +6, Persuasion +7"],["Senses","passive Perception 16"],["Spellcasting","Charisma · spell save DC 15 · +7 to hit"],["Invocations","Pact of the Blade, Thirsting Blade, Devouring Blade, Eldritch Smite, Lifedrinker, Agonizing Blast, Eldritch Mind, Fiendish Vigor"],["Feats","Alert, Tough, Lightly Armored, Moderately Armored, Weapon Master"],["Challenge","9 (proficiency bonus +4)"]],"tonight":[["Round 2","He comes through the bedroom door and acts right after Belaskro, every round. You roll his damage."],["The hammer","His pact weapon. He calls it to his hand on the stair, before he reaches the door. Your call whether anyone notices."],["First turn","Bonus action: Hex on the Hand. First hit: Eldritch Smite, 6d8 force, and the Hand is knocked prone, so his other blows have advantage."],["His turn","Three warhammer blows, +8 against AC 17. Each: 1d8 + 4 bludgeoning plus 1d6 necrotic from Hex. Once a turn add 1d6 (Lifedrinker). About 39 if all three land. He does not stop when the Hand is down."],["When the Hand dies","He gains 15 temporary hit points (Dark One's Blessing)."],["After","The body stays in his house. He carries the blue robe downstairs."]],"sections":[{"h":"","items":[["Frontier Veteran","He adds his proficiency bonus to initiative (+5 in all), and can swap initiative with a willing ally. {{Alert feat.}}"],["Pact Weapon","The crested warhammer is his pact weapon. He conjures it in his hand as a bonus action, and it is his spellcasting focus. {{Pact of the Blade.}}"],["Nothing Left to Lose but One Thing","When someone threatens his heir, his Hex goes on them first, and it stays there until they are dead. {{How he uses the Hex spell.}}"],["Dark One's Blessing","When he drops an enemy to 0 hit points, or one drops within 10 feet of him, he gains 15 temporary hit points. {{Fiend patron, level 3.}}"],["Dark One's Own Luck (3/Day)","After seeing a saving throw or ability check of his, he can add 1d10 to it. {{Fiend patron, level 6.}}"],["Fiendish Resilience","After each rest he picks one damage type other than force and resists it. Tonight is your call. {{Fiend patron, level 10.}}"],["Eldritch Mind","Advantage on Constitution saves to keep concentration. {{Invocation.}}"]]},{"h":"Actions","items":[["Multiattack","Three Crested Warhammer attacks. {{Thirsting Blade and Devouring Blade.}}"],["Crested Warhammer","Melee +8, reach 5 ft. Hit: 8 (1d8 + 4) bludgeoning, plus 3 (1d6) necrotic if the target is under his Hex. A Large or smaller target is pushed up to 10 feet straight away. {{Pact weapon. Push comes from the Weapon Master feat.}}"],["Lifedrinker (1/Turn)","One hit with the warhammer deals an extra 3 (1d6) necrotic, psychic or radiant damage. {{Invocation.}}"],["Eldritch Smite (1/Turn, uses a spell slot)","One hit with the warhammer deals an extra 27 (6d8) force damage, and a Huge or smaller target is knocked prone. {{Invocation, with a 5th-level slot.}}"],["Eldritch Blast","Three beams. Each: ranged spell attack +7, range 120 ft. Hit: 8 (1d10 + 3) force. {{Warlock cantrip with Agonizing Blast.}}"],["Fiendish Vigor","He casts false life on himself with no slot and gains 12 temporary hit points. {{Invocation.}}"],["Pact Magic","Three spell slots, regained on a short rest. Every spell is cast at 5th level. **Spells:** banishment (two creatures), command (five creatures), fear, fire shield, geas, hex, hold person (four humanoids), suggestion. **Also from the Fiend:** burning hands, scorching ray, fireball, stinking cloud, wall of fire, insect plague. **Once a day, no slot:** mass suggestion. {{Warlock 12. Fiend spells are always prepared. Mass suggestion is his Mystic Arcanum.}}"]]},{"h":"Bonus Actions","items":[["Hex (uses a spell slot)","One creature he can see within 90 feet. His hits on it deal an extra 1d6 necrotic, and it has disadvantage on checks with one ability he chooses. Concentration, up to 24 hours. When the target drops, he can move the curse with a later bonus action. {{Warlock spell, cast at 5th level.}}"]]},{"h":"Reactions","items":[["Hellish Rebuke (uses a spell slot)","When a creature he can see within 60 feet damages him: DC 15 Dexterity save, 33 (6d10) fire, or half on a success. {{Warlock spell, cast at 5th level.}}"]]},{"h":"Legendary Actions (3 per round, after another creature's turn)","items":[["Hammer","One Crested Warhammer attack. **Tonight:** roll 1d8 + 4 plus 1d6 from Hex, and the Hand is pushed 10 feet from the bed. {{Boss action, not a class feature.}}"],["Shove","An unarmed shove: DC 16 Strength or Dexterity save, or pushed 5 feet or knocked prone. **Tonight:** the Hand is knocked prone. Until he stands, his attacks have disadvantage and melee attacks on him have advantage. {{Boss action. Shove is an Unarmed Strike option.}}"],["Send Them","One ally within 30 feet who can see and hear him makes one weapon attack as a reaction, with advantage. He can spend all three actions to send three allies at once. **Tonight:** Belaskro. {{Boss action, as the warlord's Command Ally.}}"],["Over the Child","He moves up to his speed without provoking opportunity attacks. **Tonight:** he ends between the bed and the Hand. {{Boss action.}}"],["A Word to the Wise (Costs 2)","One creature within 30 feet that can see and hear him: DC 15 Wisdom save or frightened until the end of his next turn. {{Boss action, as the warlord's Frighten Foe.}}"]]}]},{"name":"Lord Cassian Aerrowyn","sub":"Medium humanoid (human), chaotic neutral · injured, in bed","ac":"15 (no leathers, in bed)","hp":"30 (of 97)","speed":"0 ft. tonight","abil":[16,18,14,12,12,17],"props":[["Saving Throws","Dex +7, Cha +6"],["Skills","Acrobatics +7, Athletics +6, Intimidation +6, Performance +6"],["Senses","passive Perception 11"],["Challenge","5"]],"tonight":[["In the bed","He does not leave it, whatever anyone shouts. Do not explain."],["Last ward","One of six still burns. The clock is stopped while a PC holds the room."],["Beside a PC","PC attacks against the Hand have advantage. Each round he throws one Rune-Burning Fist at the Hand, +7 against AC 17. Roll 1d6 + 4 plus 2d6 fire (average 14). {{The Help action, and his own attack.}}"],["AC 15, Con +2","If something does attack him."]],"sections":[{"h":"","items":[["Will Not Back Down","At half hit points or fewer he ignores the frightened condition."]]},{"h":"Actions","items":[["Rune-Burning Fist","Melee +7, reach 5 ft. Hit: 1d6 + 4 bludgeoning plus 2d6 fire (average 14). **Tonight:** thrown from the bed as fire, range 30 ft."]]},{"h":"Reactions","items":[["Is That All You've Got","When he takes damage from an attack he can see, he reduces it by 9 (1d10 + 4). {{The monk's Deflect Attacks, without the monk level.}}"]]}]},{"name":"Belaskro Tich","sub":"Human Ranger 4 · Folk Hero · played by Justin","ac":"15","hp":"32 (Hit Dice 4d10)","speed":"30 ft.","abil":[12,18,12,10,14,12],"props":[["Initiative","+4"],["Proficiency Bonus","+2"],["Saving Throws","Str +3*, Dex +6*, Con +1, Int +0, Wis +2, Cha +1 (* proficient)"],["Senses","passive Perception 14, Insight 12, Investigation 12"],["Proficiencies","Armor: Light Armor, Medium Armor, Shields; Weapons: Martial Weapons, Simple Weapons; Tools: Monster Harvesting Tools, Vehicles (Land)"],["Languages","Common, Common Sign Language, Dwarvish, Orc"],["Spellcasting","Wis · save DC 12 · attack +4"]],"tonight":[["AC 15","The Hand (+7) hits on an 8 or higher."],["Hunter's Mark","Already up on the Hand."],["Rune tablets","Two blank Vantry tablets left."],["Whip","Reach 10 ft."],["Wake","Cure Wounds is on his list. He cannot cure the poison."]],"sections":[{"h":"Skills","skills":[["Acrobatics","+4",""],["Animal Handling","+4","P"],["Arcana","+0",""],["Athletics","+3","P"],["Deception","+1",""],["History","+0",""],["Insight","+2",""],["Intimidation","+1",""],["Investigation","+2","P"],["Medicine","+2",""],["Nature","+0",""],["Perception","+4","P"],["Performance","+1",""],["Persuasion","+3","P"],["Religion","+0",""],["Sleight of Hand","+4",""],["Stealth","+4",""],["Survival","+6","E"]]},{"h":"Attacks","table":{"head":["Attack","Hit","Damage","Notes"],"rows":[["Crossbow, Hand","+8","1d6+4","Piercing Martial, Ammunition, Range, Light, Loading, Vex, Range (30/120)"],["Whip","+6","1d4+4","Slashing Martial, Finesse, Reach, Slow"],["Unarmed Strike","+3","2","Bludgeoning"]]}},{"h":"Spells · 1st level · 3 slots","table":{"head":["Spell","Time","Range","Duration"],"rows":[["Speak with Animals (ritual)","Action","Self","10 minutes"],["Cure Wounds","Action","Touch","Instantaneous"],["Fog Cloud","Action","120 ft./20 ft. Sphere","Conc. 1 hour"],["Longstrider","Action","Touch","1 hour"],["Detect Magic (ritual)","Action","Self/30 ft. Sphere","Conc. 10 minutes"],["★ Hunter's Mark","Bonus","90 ft.","Conc. 1 hour"]]}},{"h":"","items":[["Spell list","★ marks always-prepared spells. The sheet lists every spell available to the class and does not show which of the others are prepared today."]]},{"h":"Ranger Features","items":[["Favored Enemy","You always have Hunter’s Mark prepared and can cast it without expending a spell slot 2 times per Long Rest. [Hunter’s Mark: 2 / Long Rest • 1 Bonus Action]"],["Deft Explorer","You gain Expertise with one of your skill proficiencies. You know two languages of your choice."],["Fighting Style","[Fighting Style feat]"],["Hunter’s Lore","When a creature is marked by your Hunter’s Mark, you know whether the creature has any Immunities, Resistances, Vulnerabilities, and if the creature has any, you know what they are. [1 Bonus Action]"],["Hunter’s Prey","You gain one option of your choice. Whenever you finish a Short or Long Rest, you can replace the option with the other one. [Colossus Slayer] Once per turn, when you hit a creature that’s missing any of its HP with a weapon, the weapon deals an extra 1d8 damage. [1 Action]"]]},{"h":"Human Species Traits","items":[["Resourceful","You gain Heroic Inspiration whenever you finish a Long Rest."],["Skillful","You gain proficiency in one skill of your choice."],["Versatile","You gain an Origin feat of your choice."]]},{"h":"Feats","items":[["Savage Attacker","Once per turn when you hit a target with a weapon, you can roll the weapon’s damage dice twice and use either roll against the target."],["Archery","You gain a +2 bonus to attack rolls with Ranged weapons."],["Weapon Mastery","[Hand Crossbow (Vex)] Vex. If you hit a creature with a Hand Crossbow and deal damage to it, you have Advantage on your next attack roll against that creature before the end of your next turn. [Whip (Slow)] Slow. If you hit a creature with a Whip and deal damage to the creature, you can reduce its Speed by 10 ft. until the start of your next turn. If the creature is hit more than once with this property, the Speed reduction doesn’t exceed 10 ft. [Vex (Hand Crossbow): 1 Action] [Slow (Whip):]"]]},{"h":"Equipment","items":[["Carried","Leather, Crossbow, Hand, Whip, Crossbow Bolts ×20, Clothes, Common, Pot, Iron, Shovel, Monster Harvesting Tools ×0, Sun and Moon Signet Ring, Blank Rune Tablets ×3, Sabotaged Shield Runes ×2, Unbowed Instruction Letter"]]}]},{"name":"Gabriele d'Avidicci","sub":"Human Cleric 5 · Soldier · played by Peter","ac":"15","hp":"33 (Hit Dice 5d8)","speed":"30 ft.","abil":[11,8,13,14,16,14],"props":[["Initiative","−1"],["Proficiency Bonus","+3"],["Saving Throws","Str +0, Dex -1, Con +1, Int +2, Wis +6*, Cha +5* (* proficient)"],["Senses","passive Perception 13, Insight 13, Investigation 12"],["Proficiencies","Armor: Light Armor, Medium Armor, Shields; Weapons: Simple Weapons, Sword; Tools: Playing Card Set"],["Languages","Common, Common Sign Language, Draconic"],["Spellcasting","Wis · save DC 14 · attack +6"]],"tonight":[["AC 15","The Hand (+7) hits on an 8 or higher."],["Cure","Lesser Restoration (bonus action, always prepared) cures Noémie."],["Wake","Cure Wounds (always prepared), Healing Word at 60 ft if prepared, one Potion of Healing. New: Mass Healing Word (3rd level, bonus action, always prepared) heals up to six creatures within 60 feet."],["Preserve Life","Channel Divinity: 25 HP split among Bloodied creatures within 30 feet. Wakes every Kissed champion in range."],["Revivify","New, always prepared. Needs a 300 gp diamond, used up. He carries none."],["St. Peter","His Spiritual Weapon was last by the Vayne table."]],"sections":[{"h":"Skills","skills":[["Acrobatics","−1",""],["Animal Handling","+3",""],["Arcana","+8","P"],["Athletics","+3","P"],["Deception","+2",""],["History","+5","P"],["Insight","+3",""],["Intimidation","+5","P"],["Investigation","+2",""],["Medicine","+3",""],["Nature","+2",""],["Perception","+3",""],["Performance","+2",""],["Persuasion","+5","P"],["Religion","+5",""],["Sleight of Hand","−1",""],["Stealth","−1",""],["Survival","+3",""]]},{"h":"Attacks","table":{"head":["Attack","Hit","Damage","Notes"],"rows":[["Mace","+3","1d6","Bludgeoning Simple, Sap"],["Rapier","+0","1d8","Piercing Martial, Finesse, Vex"],["Unarmed Strike","+3","1","Bludgeoning"]]}},{"h":"Spells · Cantrips","table":{"head":["Spell","Time","Range","Duration"],"rows":[["Thaumaturgy","Action","30 ft.","1 minute"],["Toll the Dead","Action","60 ft.","Instantaneous"],["Guidance","Action","Touch","Conc. 1 minute"],["Sacred Flame","Action","60 ft.","Instantaneous"]]}},{"h":"Spells · 1st level · 4 slots","table":{"head":["Spell","Time","Range","Duration"],"rows":[["Guiding Bolt","Action","120 ft.","1 round"],["★ Cure Wounds","Action","Touch","Instantaneous"],["★ Bless","Action","30 ft.","Conc. 1 minute"],["Bane","Action","30 ft.","Conc. 1 minute"],["Protection from Evil and Good","Action","Touch","Conc. 10 minutes"],["Purify Food and Drink (ritual)","Action + 10m","10 ft./5 ft. Sphere","Instantaneous"],["Command","Action","60 ft.","Instantaneous"],["Sanctuary","Bonus","30 ft.","1 minute"],["Shield of Faith","Bonus","60 ft.","Conc. 10 minutes"],["Create or Destroy Water","Action","30 ft./30 ft. Cube","Instantaneous"],["Detect Evil and Good","Action","Self/30 ft. Sphere","Conc. 10 minutes"],["Detect Poison and Disease (ritual)","Action + 10m","Self/30 ft. Sphere","Conc. 10 minutes"],["Detect Magic (ritual)","Action + 10m","Self/30 ft. Sphere","Conc. 10 minutes"],["Healing Word","Bonus","60 ft.","Instantaneous"],["Inflict Wounds","Action","Touch","Instantaneous"]]}},{"h":"Spells · 2nd level · 3 slots","table":{"head":["Spell","Time","Range","Duration"],"rows":[["Spiritual Weapon","Bonus","60 ft.","Conc. 1 minute"],["★ Aid","Action","30 ft.","8 hours"],["★ Lesser Restoration","Bonus","Touch","Instantaneous"],["Augury (ritual)","1 min (ritual)","Self","Instantaneous"],["Find Traps","Action","120 ft.","Instantaneous"],["Prayer of Healing","10m","30 ft.","Instantaneous"],["Protection from Poison","Action","Touch","1 hour"],["Blindness/Deafness","Action","120 ft.","1 minute"],["Gentle Repose (ritual)","Action + 10m","Touch","10 days"],["Calm Emotions","Action","60 ft./20 ft. Sphere","Conc. 1 minute"],["Locate Object","Action","Self","Conc. 10 minutes"],["Silence (ritual)","Action + 10m","120 ft./20 ft. Sphere","Conc. 10 minutes"],["Continual Flame","Action","Touch","Until dispelled"],["Hold Person","Action","60 ft.","Conc. 1 minute"],["Enhance Ability","Action","Touch","Conc. 1 hour"],["Warding Bond","Action","Touch","1 hour"],["Zone of Truth","Action","60 ft./15 ft. Sphere","10 minutes"]]}},{"h":"Spells · 3rd level · 2 slots","table":{"head":["Spell","Time","Range","Duration"],"rows":[["★ Mass Healing Word","Bonus","60 ft.","Instantaneous"],["★ Revivify","Action","Touch","Instantaneous"],["Spirit Guardians","Action","Self/15 ft. Emanation","Conc. 10 minutes"],["Beacon of Hope","Action","30 ft.","Conc. 1 minute"],["Aura of Vitality","Action","Self/30 ft. Emanation","Conc. 1 minute"],["Dispel Magic","Action","120 ft.","Instantaneous"],["Remove Curse","Action","Touch","Instantaneous"],["Bestow Curse","Action","Touch","Conc. 1 minute"],["Protection from Energy","Action","Touch","Conc. 1 hour"],["Speak with Dead","Action","10 ft.","10 minutes"],["Animate Dead","1 minute","10 ft.","Instantaneous"],["Feign Death (ritual)","Action + 10m","Touch","1 hour"],["Glyph of Warding","1 hour","Touch","Until dispelled or triggered"],["Clairvoyance","10 minutes","1 mile","Conc. 10 minutes"],["Sending","Action","Unlimited","Instantaneous"],["Magic Circle","1 minute","10 ft./10 ft. Cylinder","1 hour"],["Meld into Stone (ritual)","Action + 10m","Touch","8 hours"],["Create Food and Water","Action","30 ft.","Instantaneous"],["Daylight","Action","60 ft./60 ft. Sphere","1 hour"],["Tongues","Action","Touch","1 hour"],["Water Walk (ritual)","Action + 10m","30 ft.","1 hour"]]}},{"h":"","items":[["Spell list","★ marks always-prepared spells. The sheet lists every spell available to the class and does not show which of the others are prepared today."]]},{"h":"Cleric Features","items":[["Divine Order","[Thaumaturge] You know one extra cantrip from the Cleric spell list. You also have a +3 bonus to your Arcana and Religion checks."],["Channel Divinity","You can channel energy directly from the Outer Planes to fuel magical effects. When you use this class’s Channel Divinity, you can choose which effect to create. You can use this class’s Channel Divinity 2 times per Long Rest, but can regain one expended use after finishing a Short Rest. If your Channel Divinity requires a saving throw, the DC equals your Cleric spell save DC (DC 14). [2 / Long Rest • 1 Action] [Channel Divinity: Divine Spark: 1 Action] [Channel Divinity: Turn Undead: 1 Action]"],["Disciple of Life","When a spell you cast with a spell slot restores HP to a creature, that creature regains an additional 2 + the spell slot’s level."],["Life Domain Spells","When you reach a Cleric level specified in the Life Domain Spells table, you always have the listed spells prepared."],["Preserve Life","As a Magic Action, you can expend a use of your Channel Divinity to restore 25 HP to Bloodied creatures within 30 ft. of yourself (which can include you), and divide the HP among them. This feature can only restore a creature up to half its maximum HP. [Channel Divinity: Preserve Life: 1 Action]"],["Sear Undead","Whenever you use Turn Undead, any Undead that fails its saving throw takes 3d8 Radiant damage. This damage doesn’t end the turn effect. [Channel Divinity: Sear Undead: 1 Action]"]]},{"h":"Human Species Traits","items":[["Resourceful","You gain Heroic Inspiration whenever you finish a Long Rest."],["Skillful","You gain proficiency in one skill of your choice."],["Versatile","You gain an Origin feat of your choice."]]},{"h":"Feats","items":[["Ability Score Improvement","Increase one ability score by 2 or two ability scores by 1."],["Magic Initiate (Cleric)","Two Cantrips. You learn two cantrips of your choice from the Cleric spell list. Int., Wis., or Cha. is your spellcasting ability for this feat's spells. Level 1 Spell. Choose a level 1 spell from the Cleric spell list. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have. Spell Change. Whenever you gain a new level, you can replace one of the spells you chose for this feat with a different spell of the same level from the chosen spell list. Repeatable. You can take this feat more than once, but you must choose a different spell list each time. [Wisdom]"],["Savage Attacker","Once per turn when you hit a target with a weapon, you can roll the weapon’s damage dice twice and use either roll against the target."],["Soldier Ability Score Improvements","[Increase three scores (+1 / +1 / +1) •]"]]},{"h":"Equipment","items":[["Carried","Shield, Chain Shirt, Father Baricello's Rosary, Mace, Rapier, Backpack, Father Barichello's Bible, Potion of Healing, Rations ×7, Robe, Blanket, Tinderbox, Lamp, Holy Water"]]}]},{"name":"Gus (AM-FIU-27)","sub":"Warforged Artificer 5 · Faction Agent · played by Shane","ac":"18","hp":"28 (Hit Dice 5d8)","speed":"30 ft.","abil":[10,14,10,16,12,13],"props":[["Initiative","+2"],["Proficiency Bonus","+3"],["Saving Throws","Str +0, Dex +2, Con +3*, Int +6*, Wis +1, Cha +1 (* proficient)"],["Senses","passive Perception 14, Insight 14, Investigation 16"],["Damage Resistances","poison; advantage on saves against being poisoned"],["Proficiencies","Armor: Light Armor, Medium Armor, Shields; Weapons: Firearms, Martial Weapons, Simple Weapons; Tools: Alchemist's Supplies, Forgery Kit, Smith's Tools, Thieves' Tools, Tinker's Tools"],["Languages","Common, Dwarvish, Elvish, Sylvan"],["Spellcasting","Int · save DC 14 · attack +6"]],"tonight":[["AC 18","The Hand (+7) hits on an 11 or higher."],["Shield","Always prepared: as a reaction, +5 AC against the attack that hit, until his next turn."],["Poison resistance","The Hand's hit deals him 10 instead of 14."],["Extra Attack","New: two attacks a turn. The light crossbow has Loading, so only one bolt per action; the second attack needs the dagger, the spear or an unarmed strike. {{Loading, 2024 rules.}}"],["Cure","New: Lesser Restoration and Protection from Poison are on his 2nd-level list, if prepared. Either one cures a Kissed champion."],["Detect magic","Finds the oathmark on essage, emits odor or nonverbal sound, static visual effect including up to 25 words of text. You can affect a maximum of 3 objects at a time. [3 / Other • 1 Action]"],["Spellcasting","You can cast prepared artificer spells using INT as your spellcasting modifier (Spell DC 14, Spell Attack +6) and prepared artificer spells as rituals if they have the ritual tag. You must have a spellcasting focus, specifically thieves’ tools or some kind of artisan’s tool, in hand when you cast any spell with this feature."],["Infuse Item","Whenever you finish a long rest, you can touch up to 2 nonmagical objects, imbuing each of them with one of your artificer infusions, turning it into a magic item. You can attune yourself to the item the instant you infuse it, or you can forgo attunement so that someone else can attune to the item. Your infusion remains in an item indefinitely, but when you die, the infusion vanishes after 3 days. The infusion also vanishes if you give up your knowledge of the infusion or you exceed your maximum number of infusions. [2 / Other • 1 Action]"],["Artificer Infusions","You have invented numerous magical infusions that rapidly create magic items. Each infusion tells you the type of item that can receive it and if the resulting magic item requires attunement. Some infusions specify a minimum artificer level, and unless an infusion’s description says otherwise, you can’t learn it more than once."],["Artificer Specialist","The type of specialist are: [Battle Smith]"],["The Right Tool for the Job","With thieves’ tools or artisan’s tools in hand, you can magically create one set of artisan’s tools in an unoccupied space within 5 feet of you. This creation requires 1 hour of uninterrupted work, which can coincide with a short or long rest. Though the product of magic, the tools are nonmagical, and they vanish when you use this feature again. [1 Hour]"],["Tool Proficiency","You gain proficiency with smith’s tools. If you already have this proficiency, you gain proficiency with one other type of artisan’s tools of your choice."],["Battle Smith Spells","You always have certain spells prepared after you reach particular levels in this class, as shown in the Battle Smith Spells table."],["Battle Ready","You gain proficiency with martial weapons and when you attack with a magic weapon, you can use your Intelligence modifier, instead of Strength or Dexterity modifier, for the attack and damage rolls."],["Steel Defender","You have created a Steel Defender, that obeys your commands. In combat, the steel defender shares your initiative count, but it takes its turn immediately after yours. It can move and use its reaction on its own, but the only action it takes on its turn is the Dodge action. If you expend your bonus action, you can command it to take an action from its stat block, or some other action. [30 / Other • 1 Action]"],["Extra Attack","You can attack twice, rather than once, whenever you take the Attack action on your turn."]]},{"h":"Warforged Species Traits","items":[["Constructed Resilience","You have advantage on saving throws against being poisoned, and you have resistance to poison damage. You don’t need to eat, drink, or breathe. You are immune to disease. You don’t need to sleep, and magic can’t put you to sleep."],["Sentry’s Rest","When you take a long rest, you must spend at least six hours in an inactive, motionless state, rather than sleeping. In this state, you appear inert, but it doesn’t render you unconscious, and you can see and hear as normal."],["Integrated Protection","You gain a +1 bonus to Armor Class. To don or doff armor other than a shield takes 1 hour, and you must be proficient with the armor. While you live, your incorporated armor can’t be removed from your body against your will."]]},{"h":"Feats","items":[["War Caster","You have advantage on CON saving throws that you make to maintain your concentration on a spell when you take damage. You can perform the somatic components of spells even when you have weapons or a shield in one or both hands. You can use your reaction to make an opportunity attack to cast a spell that has a casting time of 1 action and targets only that creature. [1 Reaction]"]]},{"h":"Equipment","items":[["Carried","Scale Mail, Dagger, Spear, Crossbow, Light, Crossbow Bolts ×20, Backpack, Clothes, Common, Thieves' Tools, Crowbar, Hammer, Piton ×10, Rations (1 day) ×10, Rope, Hempen (50 feet), Tinderbox, Torch ×10, Waterskin"]]}]},{"name":"Princess Timbit","sub":"Custom Lineage (catfolk) Druid 5 · Noble · played by Ally","ac":"11","hp":"28 (Hit Dice 5d8)","speed":"30 ft.","abil":[8,13,10,14,12,17],"props":[["Initiative","+1"],["Proficiency Bonus","+3"],["Saving Throws","Str -1, Dex +1, Con +0, Int +5*, Wis +4*, Cha +3 (* proficient)"],["Senses","Darkvision 60 ft., passive Perception 14, Insight 11, Investigation 12"],["Proficiencies","Armor: Light Armor, Shields; Weapons: Simple Weapons; Tools: Herbalism Kit, Playing Card Set"],["Languages","Common, Druidic, Undercommon"],["Spellcasting","Wis · save DC 12 · attack +4"]],"tonight":[["AC 11","The Hand (+7) hits on a 4 or higher."],["Cure","Lesser Restoration cured Éclair last session. Check her remaining slots with Ally."],["Hold the count","Spare the Dying, 15 ft: Noémie loses no pip this round."],["Wake","Cure Wounds (always prepared). Healing Word if prepared."],["Revivify","New, always prepared. Needs a 300 gp diamond, used up. She carries only her signet ring."],["Eldritch Blast","Two beams now, +6 each, 1d10 force. 240 ft. with Spell Sniper."],["The debt","The Queen owes her, in front of witnesses."]],"sections":[{"h":"Skills","skills":[["Acrobatics","+1",""],["Animal Handling","+1",""],["Arcana","+6","P"],["Athletics","−1",""],["Deception","+3",""],["History","+5","P"],["Insight","+1",""],["Intimidation","+3",""],["Investigation","+2",""],["Medicine","+1",""],["Nature","+3",""],["Perception","+4","P"],["Performance","+3",""],["Persuasion","+6","P"],["Religion","+2",""],["Sleigh ,"rows":[["★ Revivify","Action","Touch","Instantaneous"],["★ Plant Growth","Action","150 ft./100 ft. Sphere","Instantaneous"],["Call Lightning","Action","120 ft./60 ft. Cylinder","Conc. 10 minutes"],["Conjure Animals","Action","60 ft.","Conc. 10 minutes"],["Erupting Earth","Action","120 ft./20 ft. Cube","Instantaneous"],["Sleet Storm","Action","150 ft./40 ft. Cylinder","Conc. 1 minute"],["Dispel Magic","Action","120 ft.","Instantaneous"],["Aura of Vitality","Action","Self/30 ft. Emanation","Conc. 1 minute"],["Protection from Energy","Action","Touch","Conc. 1 hour"],["Summon Fey","Action","90 ft.","Conc. 1 hour"],["Elemental Weapon","Action","Touch","Conc. 1 hour"],["Flame Arrows","Action","Touch","Conc. 1 hour"],["Tidal Wave","Action","120 ft.","Instantaneous"],["Wall of Water","Action","60 ft.","Conc. 10 minutes"],["Freedom of the Waves","Action","120 ft./10 ft. Cylinder","Instantaneous"],["Wind Wall","Action","120 ft.","Conc. 1 minute"],["Daylight","Action","60 ft./60 ft. Sphere","1 hour"],["Speak with Plants","Action","Self","10 minutes"],["Feign Death (ritual)","Action + 10m","Touch","1 hour"],["Meld into Stone (ritual)","Action + 10m","Touch","8 hours"],["Water Breathing (ritual)","Action + 10m","30 ft.","24 hours"],["Water Walk (ritual)","Action + 10m","30 ft.","1 hour"]]}},{"h":"","items":[["Spell list","★ marks always-prepared spells. The sheet lists every spell available to the class and does not show which of the others are prepared today."]]},{"h":"Wildfire Spirit","items":[["Summon","Action, one use of Wild Shape. AC 13, 30 hit points, speed 30 ft., fly 30 ft. (hover). Appearing: each creature within 10 feet, DC 12 Dexterity save or 2d6 fire. Acts after her turn; bonus action to command it."],["Flame Seed","Ranged +4, 60 ft. Hit: 1d6 + 3 fire."],["Fiery Teleportation","The spirit and each willing creature within 5 feet teleport up to 15 feet. Creatures within 5 feet of the space it left: DC 12 Dexterity save or 1d6 + 3 fire."]]},{"h":"Druid Features","items":[["Druidic","You know Druidic and always have Speak with Animals prepared. You can use Druidic to leave hidden message. You and others who know Druidic automatically spot such a message. Others spot the message’s presence with a successful DC 15 Intelligence (Investigation) check but can’t decipher it without magic. [Leave Druidic Message: Special]"],["Primal Order","You have dedicated yourself to one of the sacred roles. [Magician] You know one extra cantrip from the Druid spell list. You also gain a +1 bonus to Intelligence (Arcana or Nature) checks."],["Wild Shape","As a Bonus Action, you shape-shift into a Beast form that you have learned for this feature. You stay in that form for 2 hours or until you use Wild Shape again, have the Incapacitated condition, or die. You can also leave the form early as a Bonus Action. You can use Wild Shape 2 times per Long Rest, and regain one expended use after finishing a Short Rest. You are able to learn a number of Beast forms as outlined below, and whenever you finish a Long Rest, you can replace one of your known forms with another eligible form. • Level 2: You know 4 four Beast Forms with a max CR of 1/4 that lack a Fly Speed. • Level 4: You know 6 four Beast Forms with a max CR of 1/2 that lack a Fly Speed. • Level 8 You know 8 four Beast Forms with a max CR of 1 and can adopt a form that has a Fly Speed. [2 / Long Rest • 1 Bonus Action]"],["Wild Companion","As a Magic action, you can expend a spell slot or a use of Wild Shape to cast Find Familiar without Material components. When you cast the spell in this way, the familiar is Fey and disappears when you finish a Long Rest."],["Circle Spells","You have formed a bond with a wildfire spirit, a primal being of creation and destruction. Your link with this spirit grants you access to some spells when you reach certain levels in this class, as shown on the Circle of Wildfire Spells table."],["Summon Wildfire Spirit","As an action, you can expend one use of your Wild Shape feature to summon your wildfire spirit, rather than assuming a beast form. Each creature within 10 ft. of the spirit (other than you) when it appears must succeed on a Dex saving throw (DC 12) or take 2d6 fire damage. The spirit manifests for 1 hour, until it is reduced to 0 hit points, until you summon the spirit again, or until you die. [1 Action] [Summon Wildfire Spirit: Command: 25 / Other • 1] Bonus Action"],["Wild Resurgence","Once on each of your turns, if you have no uses of Wild Shape left, you can give yourself one use by expending a spell slot (no action required). In addition, you can expend one use of Wild Shape (no action required) to give yourself a level 1 spell slot, but you can’t do so again until you finish a Long Rest."]]},{"h":"Custom Lineage Species Traits","items":[["Variable Trait","[Darkvision] Darkvision with a range of 60 ft."]]},{"h":"Feats","items":[["Magic Initiate (Druid)","Two Cantrips. You learn two cantrips of your choice from the Druid spell list. Int., Wis., or Cha. is your spellcasting ability for this feat's spells. Level 1 Spell. Choose a level 1 spell from the Druid spell list. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have. Spell Change. Whenever you gain a new level, you can replace one of the spells you chose for this feat ADDITIONAL FEATURES & TRAITS ADDITIONAL EQUIPMENT with a different spell of the same level from the chosen spell list. Repeatable. You can take this feat more than once, but you must choose a different spell list each time. [Charisma]"],["Spell Sniper","When you cast a spell that requires you to make an attack roll, the spell’s range is doubled. Your ranged spell attacks ignore half cover and three-quarters cover. You learn one cantrip that requires an attack roll from a chosen spell list. Your spellcasting ability for this cantrip depends on the spell list you chose from. [Charisma - Bard, Sorcerer, Warlock] Your spellcasting ability for this cantrip is Charisma."]]},{"h":"Equipment","items":[["Carried","Signet Ring"]]}]}];

{t:"The last bell",k:"Combat · 20 to 30 min",
 st:{"bel": ["Stand between the Hand and the bed, or take the offer and walk.", ["The Hand: \"You're not on the contract. Leave, and I'll forget you.\"", "He met Cassian an hour ago, and has already put himself between them once.", "When the Hand is down and the hammer goes up, does he speak? He is still a deputized constable, and a dead man answers no questions.", "Family by action before family by name."]], "gab": ["Noémie, or Wrent's body.", ["Noémie has one pip left. Lesser Restoration cures her. Spare the Dying or Medicine DC 10 only holds the count.", "Wrent's body is ten paces the other way.", "He chose the dome over Wrent an hour ago, and Wrent died."]], "gus": ["Nobody is left to give him an order. What is the first thing he does?", ["Wrent lifted a hand to him as he died.", "EP-07 is his alone. What the party hears of it is Shane's call.", "His steel defender is by the Vayne table."]], "tim": ["A queen owes her, in front of witnesses. What does she ask for?", ["What she asks for now gets a yes.", "Éclair is out cold across the floor.", "Guards are trying to move Sabine out.", "Honey Cruller asked her to watch the Crown's side of the room."]]},
 who:{bel:[1,"Between the Hand and the bed. Cross-cut: one round upstairs, one beat on the floor, and back."],
      gus:[0,"EP-07. Say the line, pass the page across, say nothing else."],
      gab:[0,"Triage. Noémie has one pip left. Lesser Restoration cures; Medicine DC 10 or Spare the Dying holds the count. Wrent's body is ten paces the other way."],
      tim:[0,"The debt. A queen who owes her, a cousin out cold, guards moving Sabine out. What she asks for now gets a yes."]},
 beats:[[1,"The Hand attacks Belaskro: two Kissed Blades, +7 to hit against AC 15, 14 each."],
        [1,"Gus: \"Handler signal lost.\" Hand EP-07 to Shane."],
        [1,"Round 2: Corvane comes through the door. Hex, then three blows on the Hand, 1d8 + 4 + 1d6 each, and he does not stop."],
        [0,"The Hand is down and the hammer goes up. Does Belaskro speak? Corvane finishes it either way."],
        [0,"Cassian never leaves the bed. Do not explain it. The body stays in the house."]],
 pen:[["Justin", "Between blows you look back at the bed. Cassian is nineteen and grinning at a man who came to kill him. What about him is so plainly family that it stops your breath?", "And what about him is nothing like you?"], ["Shane", "\"Handler signal lost.\" No instruction follows it. What does Gus's body do in that silence, before he decides anything?", "And what is the first thing he chooses for himself?"], ["Whoever hits the Hand", "Show us how you fight in a nobleman's bedroom. What gets broken?", ""], ["Justin · option, ask privately", "Corvane fills the doorway, breathing hard. Since a dying worker called you \"the Marquis,\" you have known whose gang the Pyreborn are. What have you been telling yourself about your uncle since?", "Standing over this bed, who scares you more: him, or whoever sent this man?"]]},
{t:"Count the dead",k:"Roleplay · 30 min",
 st:{"gab": ["Three bodies. Whose side does he kneel at first?", ["One of them is the man he chose not to save.", "Jared Dreveth is alive because of him and owes him a life.", "He is in a priest's full dress in front of every house."]], "gus": ["Wrent's letter. Does he read it here, and does he tell anyone?", ["EP-07 step 3 is Wrent's letter. Shane reads it in his own time.", "Wrent was the Marshal his whole purpose pointed at.", "What he does with it is Shane's call."]], "tim": ["Éclair wakes furious at being saved, and Honey wants a name.", ["Éclair is alive because of her, and hates it.", "She has no name to give yet.", "The Crown's debt is hers to spend or to hold."]], "bel": ["Corvane treats him as blood for the first time. Does he take it?", ["He comes downstairs at his uncle's side, in front of the houses.", "He is still a deputized constable."]]},

      tim:[0,"Éclair wakes furious at being saved. Uncle Honey Cruller wants a name."],
      bel:[0,"Comes downstairs with Corvane. First time the uncle treats him as blood."]},
 beats:[[1,"Say every name. Garrick Moravel. Aurelian Aldric. Lieutenant Malachai Wrent. Hold the silence."],
        [0,"Jared Dreveth, alive under the table, owes Gabriele his life."],
        [0,"Rowan Halvenne is alive and shaking. Tasmin saw all of it from her chair."]],
 pen:[["Anyone", "The bells have stopped and the room is counting its own. What small, ordinary thing in this ballroom is unbearable to look at now?", "What does your character do about it?"], ["Peter", "Three bodies need rites, and one is the man you did not go to. Whose side do you kneel at first?", "What do you say over Wrent that you would not want the others to hear?"], ["Ally", "Éclair wakes furious that it was you. This is an old argument between the two of you. What was it about the first time?", ""]]},
{t:"Who opened the doors",k:"Investigation · 30 to 40 min",
 st:{"gus": ["One standing order and a room full of nobles. Who does he question first?", ["His order from EP-07: find who opened the security. That is Grey.", "Belaskro thinks he still holds Gus's leash. Gus no longer takes orders.", "Until Grey is found, the trail carries Corvane's own seal."]], "tim": ["The Queen's first look went to the stairs. Does she press a queen who owes her?", ["Pressing her puts the debt at risk.", "Honey asked her to spy on the Crown's side.", "She can name the oathmark, and knows what it means that the dead man carried one."]], "bel": ["Family or the law: who gets what he finds?", ["The batch stamp on the exit tablets matches the two blanks he carries.", "Corvane wants Grey tracked for the family, before the forged seal makes the night look staged.", "He is a deputized constable, and the order that moved the guards carried his uncle's seal."]], "gab": ["Seranthis was left untouched so it would wear the blame. Does he stand with Jared?", ["Jared knows it is a frame, and is frightened.", "In Session 11 the rosary ruled out the Dreveth government.", "Jared is his road toward Barichello."]]},
 who:{gus:[1,"His standing order from EP-07: find who opened the security. That is Grey."],
      tim:[1,"She knows courts. The Queen, the loyal page, Tasmin, and the name of the oathmark."],
      gab:[0,"The frame. Seranthis was left untouched so Seranthis would wear it. Jared is frightened."],
      bel:[0,"The blanks and the robe. The batch stamp matches his two. Corvane wants Grey tracked."]},
 beats:[[1,"The missing guards: Dunmore, the forged seal, Grey gone since the toast."],
        [1,"The oathmark on the dead man: sworn servant of the royal family."],
        [0,"Finding Grey is one mission with two owners: Gus by EP-07, Belaskro for the family."],
        [0,"Later stake: Belaskro thinks he holds Gus's leash. Gus no longer takes orders."]],
 pen:[["Ally", "You were raised in a court. The Queen's first look went to the stairs, and you caught it. Who taught you to watch where a ruler looks first, and what did the lesson cost you?", "What does it tell you to do now: press her, or keep it?"], ["Shane", "One standing order, and a room of nobles who have never been questioned by anyone like Gus. What does he do that no trained investigator would?", "Which of them does he pick first, and why that one?"], ["Peter", "Jared is frightened and trying not to show it. You have watched frightened men try that before. Where was it, and what did you do for them?", ""]]},
{t:"Get out of my house",k:"Speeches · 10 to 15 min",
 st:{"bel": ["Family or Crown: his uncle tells every house that tonight crippled Cassian.", ["He was in that room. The Hand never touched Cassian.", "He is named as the nephew in front of every house. It is a gift and a trap.", "What does he do with his face?"]], "tim": ["The Queen repeats the debt by name on her way out.", ["Every house hears it. So does Corvane.", "A debt from the Crown, in a room that is turning against the Crown."]]},
 who:{bel:[1,"Named as the nephew in front of every house. He was in that room: the Hand never touched Cassian."],
      tim:[0,"The debt. Sabine repeats it by name on her way out."],
      gab:[0,"Listens, with Jared Dreveth at his elbow."],
      gus:[0,"Listens. Watches who looks at the stairs."]},
 beats:[[1,"Sabine, leaving under guard: \"I gave that toast. I will not pretend otherwise.\""],
        [1,"Corvane stops her at the door with the blue robe. If shown the oathmark, he names it and the room goes silent."],
        [1,"Corvane's speech: alive because of my nephew, will never walk again, I will stand for him."],
        [1,"Hard out: \"Now get out of my house.\""]],
 pen:[["Justin", "Your uncle has just told every house that tonight crippled his son. You were in that room, and you know what the Hand did not do. Every eye that leaves Corvane lands on you. What do they see?", "And what do you do with your hands?"], ["Anyone", "The houses file out past the bodies. What do you see one of them do that tells you this city has already picked sides?", ""]]},
{t:"Before dawn",k:"Montage · 15 min",order:["bel","tim","gab","gus"],
 st:{"bel": ["Corvane offers him a room in the guest wing. Family or Crown?", ["Taking it puts him under his uncle's roof and in his uncle's camp.", "He is still a deputized constable.", "Corvane's ask stands: track Grey, before someone says he did this to his own son.", "He knows the Hand never touched Cassian."]], "tim": ["Her uncle takes her home this instant. Does she go quietly?", ["Security is discussed in the morning. Then, with clearer heads, they decide whether she is sent home to Meow.", "The Queen's debt is hers, and it is only worth something if she stays.", "Honey still wants a name."]], "gab": ["Jared asks him to Seranthis as a guest. Does he go, ahead of the others?", ["He is no longer under Arcane Marshal oversight. He is a free man.", "He saved Jared's life, and House Dreveth respects men of the cloth.", "They leave in the morning. The Crown will blame Seranthis and come after them.", "Moravel soldiers are already outside the Seranthis embassy.", "Jared is his road toward Barichello."]], "gus": ["No handler and no orders. What did he do tonight, and where did he spend the night?", ["Wherever he says, a Steven finds him: \"Fine weather for the season.\"", "The reply is \"Every season has weather.\" Anything else marks a hostile.", "Cut to black before Shane answers."]]},
 who:{bel:[1,"Corvane offers him a room in the guest wing, as family. His ask stands: track Grey."],
      tim:[1,"Honey Cruller takes her home this instant. Security is for the morning, and then whether she is sent home to Meow."],
      gab:[1,"Jared asks him to Seranthis as a guest, for saving his life. They leave in the morning, before the Crown comes after them."],
      gus:[1,"Left to his own devices. Ask what he did alone tonight and where he spent the night. Wherever that is, a Steven finds him."]},
 beats:[[1,"Belaskro: Corvane offers him a room in the guest wing."],
        [1,"Timbit: her uncle takes her home this instant. Security in the morning, then whether she goes back to Meow."],
        [1,"Gabriele: Jared invites him to Seranthis as a guest. They leave in the morning, before the Crown blames them."],
        [0,"Gus: left alone. Ask what he did this evening and where he spent the night."],
        [1,"Wherever he says, a Steven walks up: \"Fine weather for the season.\" Cut to black."]],
 pen:[["Justin", "Corvane walks you to the guest wing himself. It is finer than anywhere you have slept. What is the one thing in that room you cannot stop looking at?", "Do you unpack?"], ["Ally", "Your uncle does not let go of your arm until the embassy door shuts. What do you look back at, one last time, before it does?", "What will you say in the morning to be allowed to stay?"], ["Peter", "Jared offers you Seranthis, and tonight you answer to no one. When did you last choose for yourself where to go?", "What do you pack first?"], ["Shane", "The manor doors close behind you and nobody tells you where to go. Where do your feet take you?", "What do you do there until the light changes? The Steven finds him in that exact place."]]}
];

const EVID=[
["guards",1,"The missing guards","No roll","Captain Dunmore, pale: \"Your seal, my lord. Guards to the gates, so the Dreveth party wouldn't feel watched. Under-Steward Grey handed it to me himself.\" Corvane: \"I gave no such order.\" Nobody has seen Grey since the toast. The order carries Corvane's own seal, so until Grey is found the trail points back at the Marquis.",["gus","bel"]],
["knives",0,"What the Knives left","Investigation 14","None were taken, so this is all there is. Snapped exit tablets: rough Vantry blanks with a batch stamp, the same stock as Belaskro's two. Cloaks and instrument cases on the gallery, and in one case the hiring chit for the extra players, signed by Under-Steward Grey. The man upstairs carried no tablet.",["gus","bel"]],
["oath",1,"The oathmark","Arcana 14 or detect magic","A hidden mark under the dead man's skin. Timbit, or History 12, names it: an oathbond. Royal houses change with the tournament, so everyone who lives and serves in the palace is sworn to the royal family. Leave that service without leave and you die. He was alive, bound and serving tonight.",["gus","tim"]],
["robe",0,"The blue robe","No roll","The Hand wore a royal page's robe. Corvane takes it as proof. A calmer head says a robe can be stolen. The mark cannot.",["bel"]],
["page",0,"The loyal page","Persuasion 12","Raised the dais shield on the Queen's own instruction from that morning: \"At the first sign of trouble.\" He wears the same oathmark and will show it: the price of a life in the palace at the King's side. Told the dead man had one, he goes white.",["tim"]],
["queen",0,"The Queen","Insight 14","She is shaken for real, and it is the ballroom that shook her. Her first look still went to the stairs.",["tim"]],
["tasmin",0,"Tasmin, the witness","Persuasion 12","They dropped from the musicians' gallery. Nobody on staff knew every player. No blade ever came near her table. The shout from upstairs came before the first knife.",["tim"]],
["chair",0,"The empty chair","No roll","Seranthis was left untouched so Seranthis would wear it. Jared Dreveth knows it and is frightened.",["gab"]]
];

const VOICES=[
{n:"Corvane",how:"Gravelly, deep, deliberate. Quiet to roaring in three seconds.",beats:[
 ["The bedroom",["Get away from my son.","You came into my house.","Stand aside, nephew. This one is mine.","I know that robe."]],
 ["The count",["Someone cover that child.","Say their names. All of them."]],
 ["The missing guards",["I gave no such order.","Find Grey. Bring him to me breathing."]],
 ["To the Queen",["A royal page, Majesty. In my son's bedroom.","Your toast. Your livery. Explain it to the room."]],
 ["To Belaskro, before dawn",["There is a room for you in the guest wing. Family sleeps under my roof.","You stood between my boy and a knife. That makes you mine.","You track things. Track Grey, before someone says I did this to my own son."]],
 ["Anger",["Quiet. ... QUIET.","Power is safety, and my duty is to keep my family safe."]]]},
{n:"Cassian",how:"Arrogant, unaffected, performing even now. Nineteen.",beats:[
 ["The bedroom",["Is that all you've got?","Cousin. You're late, and you are dressed like a tapestry.","I am not getting out of this bed. Stop asking."]],
 ["Fighting beside Belaskro",["Left side, he favours the left.","Burn, you patient bastard."]],
 ["When Corvane arrives",["Father. ... Father, that's enough.","Tell them I laughed."]]]},
{n:"The Hand",how:"Flat, professional, unhurried. Never raises his voice.",beats:[
 ["Opening",["You're not on the contract.","Leave, and I'll forget you.","One name. Yours isn't it."]],
 ["Combat",["You are making this expensive.","He stays in the bed. Interesting."]],
 ["When Corvane enters",["Marquis. This was meant to be quiet."]],
 ["Dying",["I did as I was sworn."]]]},
{n:"Queen Sabine",how:"Public voice: graceful, warm, entirely composed. More gracious under stress.",beats:[
 ["The debt",["Whoever you are, the crown is in your debt.","Princess Timbit. I do not owe many debts, and I forget none of them."]],
 ["If the boon is too large",["You ask a queen for a kingdom's worth, Princess. I said the Crown was in your debt. I did not say it was bankrupt.", "That is not mine to give tonight. Ask me for something I can put in your hand before I reach that door.", "A debt is paid in the coin the debtor holds. Name something smaller and it is yours now. The rest we will speak of at the palace.", "I will not refuse you in front of this room. I will ask you to ask again, more wisely."]],
 ["Pressed (Insight 14)",["Is the boy alive?","I asked for a toast. I did not ask for this."]],
 ["Corvane and the robe",["A robe, Marquis. Robes are stolen every day.","Grief makes poor evidence. I will forgive it tonight."]],
 ["Leaving",["I gave that toast. I will not pretend otherwise, and I will not let anyone pretend it was mine."]]]},

 const order=mvOrder(m);
 return `<div class="sph0"><div class="mvh"><div class="mvn">Movement ${S.mv+1} of 5 · ${esc(m.k)}</div><div class="mvt">${esc(m.t)}</div></div>
  <div class="tally th"><small>Had the floor</small>${PCO.map(k=>`<span class="pc ${k}" data-a="tally" data-v="${k}" role="button" tabindex="0">${PCN[k].slice(0,3)} ${S.tally[k]}</span>`).join("")}<button class="quiet" data-a="tally0">clear</button></div>
  <div class="nav"><button data-a="mv" data-v="-1"${S.mv===0?" disabled":""} aria-label="Previous movement">◀</button><button class="pri" data-a="mv" data-v="1"${nx?"":" disabled"}>${nx?"Next: "+esc(nx.t)+" ▶":"Last movement"}</button></div></div>
 <div class="spg${m.pen.length>3?" pr":""}">
 <div><div class="wl">${order.map(k=>`${chip(k,m.who[k][0],PCN[k]+(m.who[k][0]?" ★":""))}<span>${esc(m.who[k][1])}</span>`).join("")}</div></div>
 <div><div class="lab" style="margin-bottom:4px">Beats</div>${m.beats.map((b,i)=>{const k=S.mv+"-"+i,d=S.beats[k];return `<div class="tick${d?" done":""}" data-a="beat" data-v="${k}" role="button" tabindex="0"><i>${d?"✓":""}</i><span>${b[0]?'<span class="flag">⚑ </span>':""}${esc(b[1])}</span></div>`;}).join("")}
  <div class="tally tb"><small>Had the floor</small>${PCO.map(k=>`<span class="pc ${k}" data-a="tally" data-v="${k}" role="button" tabindex="0">${PCN[k].slice(0,3)} ${S.tally[k]}</span>`).join("")}<button class="quiet" data-a="tally0">clear</button></div></div>
 <div class="pens"><p class="penrule"><span class="lab">Hand the pen</span><span>Give half, ask for half. Take whatever comes back and build on it.</span></p>${m.pen.map(p=>`<div class="pen"><b>${esc(p[0])}</b>${esc(p[1])}${p[2]?`<small><i>Then</i> ${esc(p[2])}</small>`:""}</div>`).join("")}</div>
 </div>`;};

 return `<div class="rc ${st}" data-a="rc" data-v="${r[0]}" role="button" tabindex="0" title="${esc(r[2])}"><b>${esc(r[1])}</b><span>${esc(r[2])}</span><em>${lab}${r[0]==="noemie"&&st==="down"?(S.pip?" · 1 pip":" · no pips, dying"):""}${pip}</em></div>`;}).join("")}</div></div>`;

const icon=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.shield}</svg>`;

 <button class="stf${c.cond.length?" has":""}${S.picker===c.id?" open":""}" data-a="pick" data-v="${c.id}" title="Statuses: tap to choose" aria-expanded="${S.picker===c.id}">${c.cond.length?c.cond.map(n=>`<span title="${esc(n)}">${icon(CI[n])}</span>`).join(""):"+ status"}</button></div>

 <div class="foot"><button class="quiet" data-a="notes" aria-expanded="${!!S.notesOpen}">Fight notes ${S.notesOpen?"▾":"▸"}</button><span class="sp"></span><button class="quiet" data-a="fight0">${S.armFight?"Tap again to reset the fight":"Reset fight"}</button></div>
 ${S.notesOpen?`<ul class="notes">${FIGHTNOTES.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}</div>`;};
