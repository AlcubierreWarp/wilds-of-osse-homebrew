P.init=()=>{const o=order(),cur=curId(),bench=S.cmb.filter(c=>!c.inCombat);
 const padBox=()=>{if(!touch||!padT)return "";const k=padT.split(":"),c=cmb(k[1]);if(!c)return "";const dm=k[0]==="dmg";
  return `<div class="pad"><div class="pt"><b>${pad||"0"}</b><span>${dm?"Hit points to take from or give to":"New initiative for"} ${esc(c.name)}</span></div>
  <div class="pk">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-a="pad" data-v="${n}">${n}</button>`).join("")}<button data-a="pad" data-v="b" aria-label="Delete">⌫</button><button class="quiet" data-a="padx">Cancel</button></div>
  <div class="pa">${dm?`<button class="mi" data-a="padgo" data-v="-">− Damage</button><button class="pl" data-a="padgo" data-v="+">+ Heal</button>`:`<button class="on" data-a="padgo" data-v="=" style="color:#1a130c">Set initiative</button>`}</div></div>`;};
 const row=c=>`<div class="ir${c.id===cur?" cur":""}${c.hp<=0?" dn":""}">
 ${touch?`<button class="inn${padT==="ini:"+c.id?" sel":""}" data-a="padsel" data-v="ini:${c.id}" aria-label="Initiative for ${esc(c.name)}">${c.init}</button>`:`<input class="inn" id="ini-${c.id}" data-c="${c.id}" type="number" inputmode="numeric" value="${c.init}" aria-label="Initiative for ${esc(c.name)}">`}
 ${side(c)}
 <div class="im"><b>${esc(c.name)}</b><small>${c.custom?"Added at the table":`AC ${c.ac} · ${esc(c.atk)}`}</small></div>
 <div class="dm">${touch?`<button class="dmgf${padT==="dmg:"+c.id?" sel":""}" data-a="padsel" data-v="dmg:${c.id}" aria-label="Damage or heal ${esc(c.name)}">±</button>`:`<input class="dmgf" id="dmg-${c.id}" data-c="${c.id}" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Hit points to add or subtract for ${esc(c.name)}"><button class="mi" data-a="dmg" data-v="${c.id}:-" title="Subtract from ${esc(c.name)}" aria-label="Subtract from ${esc(c.name)}">−</button><button class="pl" data-a="dmg" data-v="${c.id}:+" title="Add to ${esc(c.name)}" aria-label="Add to ${esc(c.name)}">+</button>`}<button class="out" data-a="inc" data-v="${c.id}" title="Send ${esc(c.name)} to the bench" aria-label="Send ${esc(c.name)} to the bench">×</button></div></div>`;
 return `${head("Initiative",`<button class="quiet" data-a="turn" data-v="-1" aria-label="Previous turn">◀</button><span class="mv">Round ${S.round}</span><button class="pri" data-a="turn" data-v="1">Next turn ▶</button>`)}<div class="pb">${padBox()}<div class="ini">${o.length?o.map(row).join(""):'<div class="empty">Nobody is in combat.</div>'}</div>
 <div class="bench"><small>Bench</small>${bench.map(c=>`<button class="bn" data-a="inc" data-v="${c.id}" title="Bring ${esc(c.name)} into combat">${side(c)}${esc(c.name)}${c.note?` <em>${esc(c.note)}</em>`:""}</button>${c.custom?`<button class="quiet bx" data-a="cdel" data-v="${c.id}" aria-label="Remove ${esc(c.name)}">✕</button>`:""}`).join("")}<button class="bn add${addOpen?" on":""}" data-a="addo">+ Add</button></div>
 ${addOpen?`<div class="addf"><input id="aname" type="text" autocomplete="off" placeholder="Name" aria-label="Name"><input id="ahp" type="number" inputmode="numeric" min="1" placeholder="HP" aria-label="Hit points"><button data-a="cadd" data-v="enemy">Enemy</button><button data-a="cadd" data-v="ally">Ally</button><button data-a="cadd" data-v="party">Party</button></div><p class="hint">Type a name and hit points, then tap a side. They join the fight at initiative 10.</p>`:""}</div>`;};

P.speech=()=>{const names=["Garrick Moravel","Aurelian Aldric"];if(S.roll.noemie==="dead")names.push("Noémie Vayne");

 const cas=S.roll.cassian==="dead";
 const sab=`<p class="dir">Shaken under the grace. Leaving under guard.</p><p>I gave that toast. I will not pretend otherwise, and I will not let anyone pretend it was mine.</p><p>Whoever did this tonight has made the Crown a victim alongside every family in this room. The Marshals will have everything I can give them.</p><p class="dir">On her way out, by name:</p><p>Princess Timbit. The Crown remembers its debt.</p>`;
 const cor=`<p class="dir">Quiet, then loud, then quiet. The blue robe is in his fist.</p><p>Quiet. <span class="dir">(beat)</span> QUIET.</p>
 <p>Five children stood up in my house tonight to be cheered. <span class="cond">${esc(dead)}</span> will be carried out of it.</p>
 <p>${cas?'<span class="cond">My son is upstairs, dead in his own bed.</span>':'My son is upstairs, alive because of <span class="cond">my nephew</span>. He will never walk again.'} Twice now someone has reached into my family to take him. Tonight they reached into all of yours.</p>
 <p>You all heard whose toast they were waiting for. You have seen whose robe was in my son's bedroom. I will not tell you what that means. You have eyes.</p>
 <p>Two months, we were told. Two months to heal. Look at this floor and tell me who was meant to heal.</p>
 <p>The founders wrote that the crown belongs to whoever is strong enough to stand up and take it. Every generation. Any citizen. Someone would rather there was nobody left standing.</p>

 <div class="tonight"><h4>Tonight</h4>${c.tonight.map(ent).join("")}</div>
 ${c.sections.map(x=>(x.h?`<h3>${esc(x.h)}</h3>`:"")+(x.items?x.items.map(ent).join(""):"")
  +(x.skills?`<div class="skl">${x.skills.map(k=>`<div class="${k[2]?"pr":""}"><span>${k[2]==="E"?"◆":k[2]==="P"?"●":"○"} ${esc(k[0])}</span><b>${esc(k[1])}</b></div>`).join("")}</div><p class="key">● proficient · ◆ expertise</p>`:"")
  +(x.table?`<table class="tb"><tr>${x.table.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${x.table.rows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===0?"<b>"+md(v)+"</b>":md(v)}</td>`).join("")}</tr>`).join("")}</table>`:"")).join("")}</div></div>`;};

P.sealed=()=>{if(!S.sealOpen)return `<button class="sealbtn" data-a="seal" data-v="1">Sealed. Tap to open.</button>`;
 const view=S.sealView||(S.tab===3?"clocks":"secrets");
 return `${head("Sealed",`<button class="${view==="secrets"?"on":""}" data-a="sview" data-v="secrets">Do not reveal</button><button class="${view==="clocks"?"on":""}" data-a="sview" data-v="clocks">Clocks</button><button class="pri" data-a="seal" data-v="0">Close</button>`)}<div class="pb">${view==="secrets"?`<ul class="sec">${SECRETS.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:`<table class="ck"><tr><th>Who</th><th>Next move</th><th>If the party stalls</th></tr>${CLOCKS.map(c=>`<tr><td>${esc(c[0])}</td><td>${esc(c[1])}</td><td>${esc(c[2])}</td></tr>`).join("")}</table>`}</div>`;};

function report(){const L=[],d=new Date(),z=n=>String(n).padStart(2,"0");
 L.push("# Ossë S13 board export","",`Exported: ${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`,`Movement reached: ${S.mv+1} of ${MOVES.length}, ${MOVES[S.mv].t}`,"Key: [x] done or found, [ ] not. ⚑ marks a flagged item.","","## Beats");
 MOVES.forEach((m,i)=>{L.push("",`### ${i+1}. ${m.t}${i>S.mv?" (not reached)":""}`,"");m.beats.forEach((b,j)=>L.push(`- [${S.beats[i+"-"+j]?"x":" "}] ${b[0]?"⚑ ":""}${b[1]}`));});
 L.push("",`## Evidence (${EVID.filter(e=>S.ev[e[0]]).length} of ${EVID.length} found)`,"");
 EVID.forEach(e=>L.push(`- [${S.ev[e[0]]?"x":" "}] ${e[1]?"⚑ ":""}${e[2]} (${e[3]}; for ${e[5].map(k=>PCN[k]).join(", ")})${S.ev[e[0]]?"":": NOT FOUND"+(e[1]?", carries to the next session":"")}`));
 L.push("","## Roll call","");
 ROLL.forEach(r=>{const st=S.roll[r[0]];L.push(`- ${r[1]}: ${st}${r[0]==="noemie"&&st==="down"?(S.pip?", 1 pip left":", no pips, dying"):""}${st!==r[3]?` (started ${r[3]})`:""}`);});
 L.push("","## The fight","",`- Round: ${S.round}`);
 S.cmb.forEach(c=>L.push(`- ${c.name} (${c.side}${c.custom?", added at the table":""}): ${c.hp} of ${c.maxHp} HP${c.hp<=0?", down":""}, initiative ${c.init}, ${c.inCombat?"in the fight":"on the bench"}${c.cond.length?", statuses: "+c.cond.join(", "):""}`));
 L.push("","## Had the floor","",...PCO.map(k=>`- ${PCN[k]}: ${S.tally[k]}`));
 const st={mv:S.mv,beats:S.beats,tally:S.tally,roll:S.roll,pip:S.pip,cmb:S.cmb,round:S.round,turnId:S.turnId,ev:S.ev};
 L.push("","## Board state","","Paste this whole export back into the screen's Export box to restore the board.","","```json",JSON.stringify({key:KEY,state:st}),"```","");
 return L.join("\n");}
const xval=()=>{const e=document.getElementById("xtext");return e?e.value:"";};
const xsay=t=>{xnote=t;const e=document.getElementById("xmsg");if(e)e.textContent=t;};
const modalHTML=()=>`<div class="modal"><div class="mbox"><div class="ph"><span class="lab">Export the board</span><span class="sp"></span><button class="pri" data-a="xclose">Close</button></div>
 <p class="hint" style="margin:0">Give this text to Claude with the summary and transcript. It lists every beat, clue, name and roll as the board stands now.</p>
 <textarea id="xtext" spellcheck="false" aria-label="Board export">${esc(xdraft!==null?xdraft:report())}</textarea>
 <div class="btns"><button class="on" data-a="xcopy">Copy</button>${navigator.share?'<button data-a="xshare">Share</button>':""}<button data-a="xfile">Save as file</button><span class="xmsg" id="xmsg">${esc(xnote)}</span><span class="sp"></span><button class="quiet" data-a="xrestore">${armRestore?"Tap again to replace the board":"Restore from pasted export"}</button></div></div></div>`;

const ROWS={1:"fit-content(45%) fit-content(40%) repeat(5,minmax(0,1fr))",2:"fit-content(40%) fit-content(40%) fit-content(250px) minmax(0,1fr) minmax(0,1fr) minmax(0,.6fr) minmax(0,.6fr)",3:"fit-content(40%) fit-content(40%) minmax(0,3.7fr) minmax(0,.95fr) minmax(0,.55fr)"};
const LAYOUT={
1:[["spot","1 / -1","1"],["stakes","1 / -1","2","fold"],["stats","1","3 / 7"],["health","2","3 / 5"],["init","2","5 / 7"],["voices","1","7"],["roll","2","7","mini"]],
2:[["spot","1 / -1","1"],["stakes","1 / -1","2","fold"],["roll","1 / -1","3"],["evidence","1 / -1","4 / 6"],["voices","1","6 / 8"],["sealed","2","6 / 8"]],
3:[["spot","1 / -1","1"],["stakes","1 / -1","2","fold"],["speech","1 / -1","3"],["roll","1","4","mini"],["evidence","2","4","mini"],["sealed","1 / -1","5"]]
};

function render(){const app=document.getElementById("app");const keep={},vals={};
 app.querySelectorAll("input.dmgf,.addf input").forEach(i=>{if(i.value)vals[i.id]=i.value;});
 const ae=document.activeElement,was=ae&&ae.tagName==="INPUT"?ae.id:null;
 app.querySelectorAll("[data-k]").forEach(el=>{const s=el.querySelector(".pb")||el.querySelector(".spg")||el;keep[el.dataset.k]=s.scrollTop;});
 app.className=touch&&!single?"touch":"";
 if(touch&&!single){const views=TV[S.tab],vi=Math.min((S.tv&&S.tv[S.tab])||0,views.length-1),v=views[vi];
  app.innerHTML=`<div class="bar">${TABN.map((t,i)=>`<button class="tabb${S.tab===i+1?" on":""}" data-a="tab" data-v="${i+1}">${t}</button>`).join("")}<span class="sp"></span><button class="sm" data-a="xopen">Export</button><button class="quiet" data-a="reset">${S.armReset?"Tap again to reset":"Reset"}</button><a class="home" href="../" title="Back to the Wilds of Ossë table hub">← Table hub</a></div>
  <div class="tgrid"><section class="pn spot" data-k="t-spot">${P.spot()}</section>
  <div class="tright"><div class="seg">${views.map((x,i)=>`<button class="${i===vi?"on":""}" data-a="tv" data-v="${i}">${x[0]}</button>`).join("")}</div>
  <div class="tview${v[2]?" "+v[2]:""}" style="--n:${v[1].length}">${v[1].map(k=>`<section class="pn" data-k="t-${S.tab}-${k}">${P[k]()}</section>`).join("")}</div></div></div>`;}
 else if(single){app.innerHTML=`<div class="grid one"><section class="pn${single==="spot"?" spot":""}" data-k="one-${single}">${P[single]()}</section></div>`;}
 else{app.innerHTML=`<div class="bar">${TABN.map((t,i)=>`<button class="tabb${S.tab===i+1?" on":""}" data-a="tab" data-v="${i+1}">${t}</button>`).join("")}<span class="sp"></span><span class="mv">Movement ${S.mv+1}: ${esc(MOVES[S.mv].t)}</span><button class="sm" data-a="xopen">Export</button><button class="quiet" data-a="reset">${S.armReset?"Tap again to reset":"Reset"}</button><a class="home" href="../" title="Back to the Wilds of Ossë table hub">← Table hub</a></div>
 <div class="grid" style="grid-template-rows:${ROWS[S.tab]}">${LAYOUT[S.tab].map(l=>`<section class="pn${l[0]==="spot"?" spot":""}${l[3]?" "+l[3]:""}" data-k="${S.tab}-${l[0]}" style="grid-column:${l[1]};grid-row:${l[2]}">${P[l[0]]()}</section>`).join("")}</div>`;}
 if(modal&&!single)app.insertAdjacentHTML("beforeend",modalHTML());
 app.querySelectorAll("[data-k]").forEach(el=>{const v=keep[el.dataset.k];if(v){const s=el.querySelector(".pb")||el.querySelector(".spg")||el;s.scrollTop=v;}});
 Object.keys(vals).forEach(id=>{const i=document.getElementById(id);if(i)i.value=vals[id];});
 const f=wantFocus||was;wantFocus=null;if(f){const el=document.getElementById(f);if(el)el.focus();}}

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function hpAdj(c,d){c.hp=clamp(c.hp+d,0,c.maxHp);if(c.roll)S.roll[c.roll]=c.hp>0?"standing":(c.side==="enemy"?"dead":"down");}
const A={
 tab:v=>{S.tab=+v;S.sealOpen=false;S.sealView=null;},
 tv:v=>{if(!S.tv)S.tv={1:0,2:0,3:0};S.tv[S.tab]=+v;S.sealOpen=false;S.sealView=null;},

 stk:v=>{if(!S.stOpen)S.stOpen={};S.stOpen[v]=!S.stOpen[v];},
 mv:v=>{S.stOpen={};S.mv=clamp(S.mv+ +v,0,4);S.tab=MVTAB[S.mv];S.sealOpen=false;S.sealView=null;},
 beat:v=>{S.beats[v]=!S.beats[v];},
 tally:v=>{S.tally[v]++;},
 tally0:()=>{PCO.forEach(k=>S.tally[k]=0);},
 rc:v=>{const o=["standing","down","dead"];S.roll[v]=o[(o.indexOf(S.roll[v])+1)%3];},
 pip:()=>{S.pip=S.pip?0:1;},
 rnd:v=>{S.round=clamp(S.round+ +v,1,20);},
 dmg:v=>{const k=v.split(":"),c=cmb(k[0]),f=document.getElementById("dmg-"+k[0]);const n=Math.abs(parseInt(f&&f.value,10));if(!c||!n){wantFocus="dmg-"+k[0];return;}hpAdj(c,k[1]==="-"?-n:n);if(f){f.value="";f.blur();}},
 ini:v=>{const k=v.split(":"),c=cmb(k[0]),n=parseInt(k[1],10);if(c&&!isNaN(n))c.init=clamp(n,-20,99);},
 inc:v=>{const c=cmb(v);if(c){c.inCombat=!c.inCombat;if(S.picker===v)S.picker=null;if(padT&&padT.split(":")[1]===v){padT=null;pad="";}}},
 pick:v=>{S.picker=S.picker===v?null:v;},
 cond:v=>{const k=v.split(":"),c=cmb(k[0]);if(!c)return;const i=c.cond.indexOf(k[1]);if(i<0)c.cond.push(k[1]);else c.cond.splice(i,1);},
 notes:()=>{S.notesOpen=!S.notesOpen;},
 fight0:()=>{if(S.armFight){S.cmb=JSON.parse(JSON.stringify(CMB0));S.round=1;S.turnId=null;S.picker=null;padT=null;pad="";S.roll.hand="standing";S.roll.cassian="standing";S.armFight=false;}else{S.armFight=true;return "keepfight";}},
 turn:v=>{const o=order();if(!o.length)return;let i=o.findIndex(c=>c.id===curId())+ +v;if(i>=o.length){i=0;S.round=clamp(S.round+1,1,99);}if(i<0){if(S.round>1){i=o.length-1;S.round--;}else i=0;}S.turnId=o[i].id;},
 padsel:v=>{padT=padT===v?null:v;pad="";},
 pad:v=>{pad=v==="b"?pad.slice(0,-1):(pad+v).replace(/^0+(?=\d)/,"").slice(0,3);},
 padx:()=>{padT=null;pad="";},
 padgo:v=>{if(!padT)return;const k=padT.split(":"),c=cmb(k[1]),n=parseInt(pad,10);if(c&&!isNaN(n)){if(k[0]==="dmg"){if(n>0)hpAdj(c,v==="-"?-n:n);}else c.init=clamp(n,-20,99);}padT=null;pad="";},
 addo:()=>{addOpen=!addOpen;if(addOpen)wantFocus="aname";},
 cadd:v=>{const nm=((document.getElementById("aname")||{}).value||"").trim().slice(0,40),hp=clamp(parseInt((document.getElementById("ahp")||{}).value,10)||1,1,999);if(!nm){wantFocus="aname";return;}let n=1;while(cmb("x"+n))n++;S.cmb.push({id:"x"+n,name:nm,side:v,init:10,inCombat:true,hp:hp,maxHp:hp,ac:"",atk:"",res:[],cond:[],custom:true});addOpen=false;},
 cdel:v=>{const i=S.cmb.findIndex(c=>c.id===v&&c.custom);if(i>=0)S.cmb.splice(i,1);},
 xopen:()=>{modal=true;xdraft=null;xnote="";armRestore=false;},
 xclose:()=>{modal=false;xdraft=null;xnote="";armRestore=false;},
 xcopy:()=>{const t=xval(),ok=()=>xsay("Copied"),fb=()=>{try{const el=document.getElementById("xtext");el.focus();el.select();if(!document.execCommand("copy"))throw 0;ok();}catch(e){xsay("Select the text and copy it by hand");}};try{navigator.clipboard.writeText(t).then(ok,fb);}catch(e){fb();}return "stay";},
 xshare:()=>{try{navigator.share({title:"Ossë S13 board export",text:xval()}).catch(()=>{});}catch(e){xsay("Sharing is not available here");}return "stay";},
 xfile:()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([xval()],{type:"text/markdown"}));a.download="osse-s13-board.md";document.body.appendChild(a);a.click();a.remove();xsay("Saved as osse-s13-board.md");}catch(e){xsay("Could not save a file here");}return "stay";},
 xrestore:()=>{const t=xval();if(!armRestore){armRestore=true;xdraft=t;return;}armRestore=false;try{const m=/```json\s*([\s\S]*?)\s*```/.exec(t),o=JSON.parse(m[1]);if(o.key!==KEY||!o.state||!o.state.roll)throw 0;Object.assign(S,o.state);normalize();modal=false;xdraft=null;xnote="";}catch(e){xdraft=t;xnote="That text has no board state for this session";}},
 ev:v=>{S.ev[v]=!S.ev[v];},
 vc:v=>{S.voice=+v;},
 vb:()=>{S.voice=null;},
 sp:v=>{S.speech=v;},
 st:v=>{S.stat=+v;},
 seal:v=>{S.sealOpen=v==="1";if(!S.sealOpen)S.sealView=null;},
 sview:v=>{S.sealView=v;},
 reset:()=>{if(S.armReset){S=fresh();}else{S.armReset=true;return "keep";}}
};
function act(el){const a=el.dataset.a;if(!A[a])return;const r=A[a](el.dataset.v);if(r==="stay")return;if(r!=="keep")S.armReset=false;if(r!=="keepfight")S.armFight=false;save();render();}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&!el.disabled){e.preventDefault();act(el);}});
document.addEventListener("change",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("inn")){A.ini(t.dataset.c+":"+t.value);save();render();}});
document.addEventListener("keydown",e=>{const t=e.target;
 if(t&&t.tagName==="TEXTAREA")return;
 if(t&&t.tagName==="INPUT"){if(e.key==="Enter"){e.preventDefault();if(t.classList.contains("dmgf")){A.dmg(t.dataset.c+":-");save();render();}else t.blur();}return;}
 if((e.key==="Enter"||e.key===" ")&&t&&t.dataset&&t.dataset.a&&t.tagName!=="BUTTON"){e.preventDefault();act(t);return;}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==="1"||e.key==="2"||e.key==="3"){A.tab(e.key);save();render();}});
window.addEventListener("hashchange",()=>{readHash();render();});
window.addEventListener("resize",()=>{const t=touch;readHash();if(t!==touch)render();});
let wl=null;async function wake(){try{if(touch&&"wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null;});}}catch(e){}}
document.addEventListener("click",wake);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake();});
readHash();render();
</script>
</body>
</html>
