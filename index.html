<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wilds of Ossë · Table Links</title>
<meta name="robots" content="noindex">
<script>try{var th=localStorage.getItem("osse-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0b0908; --panel:#16110e; --panel-2:#1d1612; --line:rgba(210,168,81,.22);
  --gold:#d2a851; --gold-hi:#f0d494; --gold-lo:#8d6829; --velvet:#6b1220; --velvet-hi:#8e1d2e;
  --text:#ece2cf; --muted:#a99a82; --arcane:#86e4ff; --bad:#ff9a9f;
  --f-display:"Cinzel",Georgia,serif; --f-body:"Spectral",Georgia,serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#2a1a12 0%,var(--ink) 55%) fixed,var(--ink);color:var(--text);
  font:17px/1.55 var(--f-body);padding:clamp(20px,5vw,56px) 16px 56px}
.wrap{max-width:880px;margin:0 auto}
a{color:var(--gold-hi)}
header{text-align:center;margin-bottom:clamp(26px,5vw,44px)}
.eyebrow{font:500 11px/1.4 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
h1{margin:.25em 0 .15em;font:600 clamp(32px,7vw,54px)/1.05 var(--f-display);letter-spacing:.06em;color:var(--gold-hi);
  text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 28px rgba(210,168,81,.25)}
.sub{margin:0;color:var(--muted);font-style:italic}
.rule{display:flex;align-items:center;gap:14px;margin:12px auto 0;max-width:340px;color:var(--gold-lo)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent)}
section{margin-top:34px}
h2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);
  font:600 20px/1.2 var(--f-display);letter-spacing:.1em;color:var(--gold)}
h2 small{font:500 11px/1.4 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;border:1px solid var(--line);border-radius:6px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));box-shadow:0 10px 24px rgba(0,0,0,.35)}
.card h3{margin:0;font:600 19px/1.25 var(--f-display);letter-spacing:.04em;color:var(--text)}
.card .who{font:500 11px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card p{margin:0;color:var(--muted);font-size:15.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:4px;
  font:500 12px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;text-align:center;
  color:#1c1206;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#a97d34);border:1px solid var(--gold-hi);box-shadow:inset 0 1px 0 rgba(255,250,225,.6)}
.btn.ghost{color:var(--gold);background:transparent;border-color:var(--gold-lo);box-shadow:none}
.btn.small{min-height:34px;padding:6px 10px;font-size:11px}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--arcane);outline-offset:2px}
.code{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--gold-lo);border-radius:4px;background:rgba(0,0,0,.25)}
.code .k{font:500 11px/1.3 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.code b{font:500 20px/1.2 var(--f-mono);letter-spacing:.2em;color:var(--gold-hi)}
.url{font:13px/1.4 var(--f-mono);color:var(--muted);word-break:break-all}
.lock{max-width:460px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 20px}
.lock .seal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:600 22px var(--f-display);color:var(--gold-hi);
  background:radial-gradient(circle at 40% 35%,var(--velvet-hi),var(--velvet) 60%,#3a0a12);box-shadow:0 0 0 2px var(--gold-lo),0 0 0 4px rgba(0,0,0,.5),0 0 22px rgba(142,29,46,.5)}
.lock form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.lock input{flex:1 1 200px;min-width:0;padding:10px 12px;text-align:center;font:500 18px/1.2 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold-hi);background:#0b0908;border:1px solid var(--gold-lo);border-radius:4px}
.lock input::placeholder{color:rgba(210,168,81,.3)}
.msg{min-height:1.4em;margin:0;font:500 12px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--bad)}
.gtext{margin:0 0 10px;color:var(--muted);font-size:15px}
.cnote{flex-basis:100%;font-size:14px;color:var(--muted);font-style:italic}
.code{margin-bottom:10px}
.links li{display:flex;gap:8px;align-items:center}
.links li a{flex:1;min-width:0}
.links{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.links a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 12px;border:1px solid transparent;border-radius:4px;text-decoration:none;color:var(--text);background:rgba(255,255,255,.025)}
.links a:hover{border-color:var(--line);background:rgba(210,168,81,.06)}
.links a span{font:12px/1.4 var(--f-mono);color:var(--muted);text-align:right}
.dm-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 16px}
.next{font:500 12px/1.5 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.next b{color:var(--gold-hi);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.tile h3{margin:0;font:600 16px/1.25 var(--f-display);letter-spacing:.04em;color:var(--text)}
.tile p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.4;flex:1}
.tile .row{margin-top:4px}
.tile .code{margin:4px 0 0;padding:6px 10px}.tile .code b{font-size:16px}
.warn{color:var(--bad);font-style:italic}
.past{font-size:13.5px;color:var(--muted)}.past a{color:var(--muted)}.past a:hover{color:var(--gold-hi)}
.check{margin-top:14px;padding:16px 18px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.check-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.check h3{margin:0;font:600 18px/1.25 var(--f-display);letter-spacing:.04em}
.prog{font:500 11px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.check ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.check ul ul{margin-left:13px;padding-left:15px;border-left:1px solid var(--line)}
.check>ul{margin-top:8px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px 26px;margin-top:10px}
.phase h4{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px;padding:6px 4px;border-bottom:1px solid var(--line);
  font:600 15px/1.25 var(--f-display);letter-spacing:.06em;color:var(--gold)}
.phase.full h4{color:var(--muted)}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:4px;cursor:pointer;font-size:15.5px;line-height:1.35}
.check label:hover{background:rgba(210,168,81,.06)}
.check input{appearance:none;flex:none;width:18px;height:18px;margin-top:1px;border:1px solid var(--gold-lo);border-radius:3px;display:grid;place-items:center;background:#0b0908}
.check input:checked{background:var(--gold);border-color:var(--gold-hi)}
.check input:checked::after{content:"✓";color:#1c1206;font-size:13px;line-height:1}
.check input:indeterminate::after{content:"";width:8px;height:2px;background:var(--gold)}
.check li.done>label span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold-lo)}
.check small{display:block;font-size:13px;color:var(--muted);text-decoration:none}
.check .auto{font:500 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-lo);margin-left:4px}
.check .foot{display:flex;justify-content:flex-end;margin-top:8px}
.quiet{margin:12px 4px 0;font-size:13.5px;color:var(--muted);text-align:right}.quiet a{color:var(--muted)}.quiet a:hover,.quiet button:hover{color:var(--gold-hi)}
.quiet button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-style:dotted}.quiet button:focus-visible{outline:2px solid var(--arcane);outline-offset:2px}
footer{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;font:500 11px/1.6 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.themes{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.themes span{margin-right:4px}
.themes button{all:unset;cursor:pointer;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.themes button:hover{color:var(--gold-hi);border-color:var(--gold-lo)}
.themes button[aria-pressed=true]{color:var(--gold-hi);border-color:var(--gold)}
.themes button:focus-visible{outline:2px solid var(--arcane);outline-offset:2px}
.poster{display:none}

/* Cover poster theme: the campaign's poster leads; stone silver, the construct's bronze, violet lightning. */
[data-theme=poster]{
  --ink:#09090c; --panel:rgba(13,13,17,.86); --panel-2:rgba(27,27,33,.82); --line:rgba(198,200,218,.17);
  --gold:#c99a5b; --gold-hi:#ebe8e1; --gold-lo:#6f6b7d; --velvet:#33246e; --velvet-hi:#6b50d6;
  --text:#e7e4de; --muted:#a19fa9; --arcane:#a58bff; --bad:#ff9fb0;
}
[data-theme=poster] body{background:var(--ink)}
[data-theme=poster] body::before{content:"";position:fixed;inset:-60px;z-index:-1;background:url(assets/poster.webp) center 30%/cover no-repeat;filter:blur(26px) saturate(.8) brightness(.32)}
[data-theme=poster] body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 90% 60% at 50% 0%,transparent,rgba(9,9,12,.75) 70%),linear-gradient(180deg,transparent 40%,rgba(9,9,12,.7))}
[data-theme=poster] .wrap{max-width:960px}
[data-theme=poster] header{margin-bottom:clamp(20px,4vw,34px)}
[data-theme=poster] .poster{display:block;width:100%;height:auto;aspect-ratio:1672/941;object-fit:cover;border-radius:8px;margin:0 0 18px;
  box-shadow:0 0 0 1px rgba(198,200,218,.16),0 24px 60px rgba(0,0,0,.7),0 0 70px rgba(107,80,214,.18)}
[data-theme=poster] header h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[data-theme=poster] .rule{color:var(--arcane)}
[data-theme=poster] .rule::before,[data-theme=poster] .rule::after{background:linear-gradient(90deg,transparent,var(--velvet-hi),transparent)}
[data-theme=poster] h2{color:var(--gold-hi);text-shadow:0 0 18px rgba(165,139,255,.35);border-bottom-color:rgba(165,139,255,.28)}
[data-theme=poster] .card,[data-theme=poster] .tile,[data-theme=poster] .check{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
[data-theme=poster] .btn{color:#170f06;background:linear-gradient(180deg,#ecca90,#c79150 55%,#7f5528);border-color:#ecca90;box-shadow:inset 0 1px 0 rgba(255,244,220,.55),0 0 0 1px rgba(0,0,0,.3)}
[data-theme=poster] .btn.ghost{color:var(--gold-hi);background:rgba(255,255,255,.03);border-color:var(--gold-lo);box-shadow:none}
[data-theme=poster] .btn.ghost:hover{border-color:var(--arcane)}
[data-theme=poster] .lock .seal{color:#f1eefe;background:radial-gradient(circle at 40% 35%,#8f78ff,var(--velvet-hi) 45%,#1d1440);box-shadow:0 0 0 2px var(--gold-lo),0 0 0 4px rgba(0,0,0,.5),0 0 26px rgba(143,120,255,.55)}
[data-theme=poster] .lock input,[data-theme=poster] .check input{background:rgba(0,0,0,.45)}
[data-theme=poster] .check input:checked{background:var(--gold);border-color:#ecca90}
[data-theme=poster] .code{background:rgba(0,0,0,.35)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="poster" src="assets/poster.webp" width="1672" height="941" alt="The Wilds of Ossë cover poster: a priest, a brass construct, a man in a white coat and a bounty hunter before a ruined castle under violet lightning" loading="lazy" decoding="async">
    <span class="eyebrow">A campaign table</span>
    <h1>Wilds of Ossë</h1>
    <p class="sub">Everything you need at the table, in one place.</p>
    <div class="rule" aria-hidden="true">✦</div>
  </header>

  <section aria-labelledby="players">
    <h2 id="players">For the players <small>Where we play</small></h2>
    <div class="cards" id="player-cards"></div>
  </section>

  <section aria-labelledby="gm">
    <h2 id="gm">Game master <small>Behind the screen</small></h2>
    <div class="card lock" id="dm-lock">
      <span class="seal" aria-hidden="true">✦</span>
      <h3>Game master only</h3>
      <p>Players: everything you need is above. This part is for the game master.</p>
      <form id="dm-form" novalidate autocomplete="off">
        <label class="sr" for="dm-code" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Passcode</label>
        <input id="dm-code" placeholder="Passcode" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="80">
        <button type="submit" class="btn">Enter</button>
      </form>
      <p class="msg" id="dm-msg" role="alert"></p>
    </div>
    <div id="dm" hidden>
      <div class="dm-head"><span class="next" id="dm-next">Loading</span><button type="button" class="btn ghost small" id="dm-out">Lock this section</button></div>
      <div id="dm-body"></div>
    </div>
  </section>

  <footer><span>Wilds of Ossë</span>
    <div class="themes" role="group" aria-label="Theme"><span>Theme</span>
      <button type="button" data-theme-set="original">Original</button><button type="button" data-theme-set="poster">Cover poster</button></div>
  </footer>
</div>

<script>
"use strict";
/* Links live here (PLAYER below; the game master section is GM_LINKS and CHECKLIST, and never repeats a player link). Addresses are relative, so the page works on GitHub Pages and on a custom domain alike.
   Codes are not: the player codes come from the Gus relay, so no code sits in this public repository. */
const PLAYER = [
  {title: "D&D Beyond", who: "Everyone",
   text: "Character sheets, spells and the campaign.", href: "https://www.dndbeyond.com/campaigns/7874419", open: "Open D&D Beyond"},
  {title: "Roll20", who: "Everyone",
   text: "The virtual table, maps and tokens.", href: "https://app.roll20.net/campaigns/details/21638976/wilds-of-osse", open: "Open Roll20"},
  {title: "Discord", who: "Everyone",
   text: "Voice and chat while we play.", href: "https://discord.com/app", open: "Open Discord"},
  {title: "The Chronicle", who: "Everyone",
   text: "Every session so far: the summary, quest lines, the people you met and the items you found.", href: "chronicle/", open: "Read the chronicle"},
  {title: "The Codex", who: "Everyone",
   text: "Everyone and everything the party has met, as far as play has shown, plus a rules and items lookup.", href: "codex/", open: "Open the codex"},
  {title: "Gus's memory archive", who: "Shane · Gus",
   text: "Gus's documents from Marshal Intelligence. Open it on your own device and enter the code your game master gave you.",
   href: "screen/gus.html", open: "Open the archive", gm: true},
];
/* Game master section. The session, its screen and the automatic ticks come from vault/status.json (rebuilt by
   tools/osse/build.py) and chronicle/chronicle.json, so nothing here changes from one session to the next. */
const GM_LINKS = [
  {title: "Ossë vault", text: "Every person, place, secret and plan, as DM pages.", href: "vault/", open: "Open the vault"},
  {title: "Session planner", text: "The boards, and the session's running order.", href: "vault/paths.html", open: "Open the planner"},
];
const HOMEBREW = "https://raw.githubusercontent.com/AlcubierreWarp/wilds-of-osse-homebrew/main/wilds-of-osse.json";
/* The session checklist: loose items, then phases. An item with items of its own is ticked when all of them are, and ticking it
   ticks them all. auto(s) ticks an item from the status files; the rest are ticked by hand and kept per session on this device. */
const CHECKLIST = [
  {id: "synced", label: "Previous session synced", note: s => `S${s.current}: vault, chronicle and codex`, auto: s => !s.error && s.chronicle >= s.current},
];
const PHASES = [
  {title: "Plan & create", items: [
    {id: "story", label: "Outline story", note: s => `${s.aimed} plans aimed at S${s.next}, ${s.ready.length} ready`},
    {id: "npcs", label: "Create NPCs"},
    {id: "maps", label: "Create maps"},
    {id: "art", label: "Create illustrations"},
    {id: "handouts", label: "Draft handouts"},
    {id: "music", label: "Select music"},
    {id: "screen-draft", label: "Draft DM screen", auto: s => s.screens.includes(s.next)},
  ]},
  {title: "Update systems", items: [
    {id: "stats", label: "Update stat sheets", note: "if required"},
    {id: "r20", label: "Update Roll20", items: [
      {id: "r20-maps", label: "Maps"},
      {id: "r20-tokens", label: "NPC tokens"},
    ]},
    {id: "screen-update", label: "Update DM screen"},
  ]},
  {title: "Session setup", items: [
    {id: "on-roll20", label: "Roll20", note: "Left screen"},
    {id: "on-discord", label: "Discord", note: "Right screen, bottom", items: [
      {id: "on-craig", label: "Craig bot"},
      {id: "on-music", label: "Music bot"},
    ]},
    {id: "on-table", label: "Campaign table", note: "Right screen, middle"},
    {id: "on-claude", label: "Claude", note: "Right screen, top"},
  ]},
];

const RELAY = (location.hostname === "localhost" && new URLSearchParams(location.search).get("relay"))
  || "https://2srnsytz3rqi3jke23bz643jhq0irvei.lambda-url.ca-central-1.on.aws";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} },
  del(k){ try { localStorage.removeItem(k); } catch(e) {} }
};
let codes = null;

function playerCards(){
  $("#player-cards").innerHTML = PLAYER.map(c => `<article class="card">
    <span class="who">${esc(c.who)}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p>
    <div class="row"><a class="btn" href="${esc(c.href)}"${c.gm ? ' data-gm="1"' : ""}>${esc(c.open || "Open")}</a></div>
  </article>`).join("");
}

/* Player codes come from the Gus relay, only with the game master passcode, so none sits in this public repository. */
async function loadCodes(code){
  try { const r = await fetch(RELAY + "/hub", {headers: {"x-gus-key": code}, cache: "no-store"}); codes = r.ok ? ((await r.json()).codes || {}) : {}; }
  catch(e) { codes = {}; }
  dmBody();
}

let status = null;
async function loadStatus(){
  try {
    const [s, c] = await Promise.all([fetch("vault/status.json", {cache: "no-store"}).then(r => r.json()),
      fetch("chronicle/chronicle.json", {cache: "no-store"}).then(r => r.json()).catch(() => ({sessions: []}))]);
    s.chronicle = Math.max(0, ...(c.sessions || []).map(x => +x.n || 0));
    status = s;
  } catch(e) { status = {current: 0, next: 0, screens: [], titles: {}, ready: [], aimed: 0, chronicle: 0, error: true}; }
  dmBody();
}
const ticks = n => { try { return JSON.parse(store.get("osse-hub-check-S" + n) || "{}"); } catch(e) { return {}; } };
function dmBody(){
  const s = status;
  if (!s) { $("#dm-body").innerHTML = ""; return; }
  const n = s.next, built = s.screens.includes(n), mine = ticks(n);
  $("#dm-next").innerHTML = s.error ? "The status file can't be read" : `Next up <b>Session ${n}</b> · after S${s.current}${s.titles[s.current] ? ", " + esc(s.titles[s.current]) : ""} · ${s.open_threads} open threads`;
  const code = codes === null ? "…" : codes.gus || "Not set";
  const past = s.screens.filter(x => x !== n).sort((a, b) => b - a);
  const tile = (title, text, rest) => `<article class="tile"><h3>${esc(title)}</h3><p>${text}</p>${rest}</article>`;
  const tiles = [
    tile(`DM screen · S${n}`, built ? "iPad for the table, tall for the vertical monitor." : `<span class="warn">Not built yet.</span>`,
      (built ? `<div class="row"><a class="btn small" href="screen/s${n}.html#ipad">iPad</a><a class="btn small" href="screen/s${n}.html#tall">Tall</a></div>` : "") +
      (past.length ? `<div class="past">Past: ${past.map(x => `<a href="screen/s${x}.html"${s.titles[x] ? ` title="${esc(s.titles[x])}"` : ""}>S${x}</a>`).join(" · ")}</div>` : "")),
    ...GM_LINKS.map(t => tile(t.title, esc(t.text), `<div class="row"><a class="btn small" href="${esc(t.href)}">${esc(t.open)}</a></div>`)),
    tile("Gus's archive code", "For Shane's device.", `<div class="code"><b>${esc(code)}</b>${codes && codes.gus ? `<button type="button" class="btn ghost small" data-copy="${esc(codes.gus)}">Copy</button>` : ""}</div>`),
  ];
  const isOn = c => c.items ? c.items.every(isOn) : !!(c.auto && c.auto(s)) || !!mine[c.id];
  const some = c => c.items ? c.items.some(some) : isOn(c);
  const leaves = list => list.flatMap(c => c.items ? leaves(c.items) : [c]);
  const count = list => { const l = leaves(list); return [l.filter(isOn).length, l.length]; };
  const item = c => {
    const on = isOn(c), auto = !!(c.auto && c.auto(s)), note = typeof c.note === "function" ? c.note(s) : c.note;
    return `<li class="${on ? "done" : ""}"><label><input type="checkbox" data-check="${c.id}"${on ? " checked" : ""}${auto ? " disabled" : ""}${!on && c.items && some(c) ? " data-some" : ""}>
      <span>${esc(c.label)}${auto ? '<i class="auto">auto</i>' : ""}${note ? `<small>${esc(note)}</small>` : ""}</span></label>${c.items ? `<ul>${c.items.map(item).join("")}</ul>` : ""}</li>`;
  };
  const phase = p => { const [d, of] = count(p.items);
    return `<div class="phase${d === of ? " full" : ""}"><h4>${esc(p.title)}<span class="prog">${d}/${of}</span></h4><ul>${p.items.map(item).join("")}</ul></div>`; };
  const [done, all] = count([...CHECKLIST, ...PHASES]);
  const focus = document.activeElement && document.activeElement.dataset.check;
  $("#dm-body").innerHTML = `<div class="tiles">${tiles.join("")}</div>
    <div class="check"><div class="check-head"><h3>Session ${n} checklist</h3><span class="prog">${done} of ${all} done</span></div>
      <ul>${CHECKLIST.map(item).join("")}</ul><div class="phases">${PHASES.map(phase).join("")}</div>
      <div class="foot"><button type="button" class="btn ghost small" id="check-reset">Clear my ticks</button></div></div>
    <div class="quiet">5e.tools homebrew: <a href="${HOMEBREW}">open the file</a> · <button type="button" data-copy="${HOMEBREW}">copy its link</button></div>`;
  document.querySelectorAll("[data-some]").forEach(x => { x.indeterminate = true; });
  if (focus) { const f = document.querySelector(`[data-check="${focus}"]`); if (f) f.focus({preventScroll: true}); }
}
document.addEventListener("change", e => {
  const c = e.target.closest && e.target.closest("[data-check]");
  if (!c || !status) return;
  const m = ticks(status.next), li = c.closest("li"), inner = li.querySelectorAll("ul [data-check]:not(:disabled)");
  (inner.length ? [...inner] : [c]).forEach(x => { m[x.dataset.check] = c.checked; });
  store.set("osse-hub-check-S" + status.next, JSON.stringify(m)); dmBody();
});
document.addEventListener("click", e => {
  if (e.target.id === "check-reset" && status) { store.del("osse-hub-check-S" + status.next); dmBody(); }
});

/* Same code style as Gus's login: abcd efgh is read as ABCD-EFGH. */
function normCode(v){
  const t = String(v || "").trim(), c = t.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  return c.length === 8 && t.length <= 11 ? c.slice(0, 4) + "-" + c.slice(4) : t;
}
async function check(code){
  try { return (await fetch(RELAY + "/gm", {headers: {"x-gus-key": code}, cache: "no-store"})).ok; }
  catch(e) { return null; }
}
function showDm(on){
  $("#dm").hidden = !on; $("#dm-lock").hidden = on;
  if (on) { codes = null; loadStatus(); loadCodes(store.get("osse-hub-dm")); }
}

$("#dm-form").addEventListener("submit", async e => {
  e.preventDefault();
  const code = normCode($("#dm-code").value), msg = $("#dm-msg");
  if (!code) { msg.textContent = "Enter the passcode."; return; }
  msg.textContent = "Checking";
  const ok = await check(code);
  if (ok === null) { msg.textContent = "The relay can't be reached. Check the connection."; return; }
  if (!ok) { msg.textContent = "That passcode was not accepted."; $("#dm-code").select(); return; }
  msg.textContent = ""; $("#dm-code").value = "";
  store.set("osse-hub-dm", code); showDm(true);
});
$("#dm-out").addEventListener("click", () => { store.del("osse-hub-dm"); showDm(false); });

document.addEventListener("click", async e => {
  const c = e.target.closest("[data-copy]");
  if (c) {
    const label = c.textContent;
    try { await navigator.clipboard.writeText(c.dataset.copy); c.textContent = "Copied"; }
    catch(err) { c.textContent = "Copy failed"; }
    setTimeout(() => { c.textContent = label; }, 1600);
  }
  /* Gus's archive shares this site's storage, so the game master view can open already unlocked. */
  const g = e.target.closest("a[data-gm]");
  if (g) { const code = store.get("osse-hub-dm"); if (code) { store.set("gus-key-gm", code); } }
});

function theme(name){
  const t = name === "poster" ? "poster" : "original";
  if (t === "poster") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === t));
  return t;
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => store.set("osse-theme", theme(b.dataset.themeSet))));
theme(store.get("osse-theme"));

playerCards();
const saved = store.get("osse-hub-dm");
if (saved) {
  showDm(true);
  check(saved).then(ok => { if (ok === false) { store.del("osse-hub-dm"); showDm(false); } });
}
</script>
